<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Рыбалка gans_mann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh; color: #fff; padding: 10px;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 20px; position: relative; overflow-x: hidden;
}
body::before {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(0,200,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,200,0.06) 0%, transparent 40%);
    pointer-events: none; z-index: 0;
}
.container { width: 100%; max-width: 900px; position: relative; z-index: 1; }

/* === ШАПКА === */
.header { text-align: center; margin-bottom: 30px; animation: fadeInDown 0.7s ease; }
.header h1 {
    font-size: 3rem; font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 10px; letter-spacing: -1.5px;
    text-shadow: 0 0 60px rgba(0, 212, 255, 0.3);
}
.header .subtitle {
    font-size: 1.05rem; color: rgba(255,255,255,0.6);
    font-weight: 400;
}

/* === ФОРМА ПОИСКА === */
.search-form {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    animation: fadeInUp 0.7s ease;
    text-align: center;
}
.search-form h2 {
    font-size: 1.3rem; margin-bottom: 20px; color: #00d4ff;
    font-weight: 700;
}
.search-input-wrap {
    display: flex; gap: 12px; max-width: 500px; margin: 0 auto;
}
.search-input {
    flex: 1;
    padding: 16px 20px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(0,212,255,0.3);
    border-radius: 14px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.3s;
    outline: none;
}
.search-input::placeholder {
    color: rgba(255,255,255,0.4);
    font-weight: 500;
}
.search-input:focus {
    border-color: rgba(0,212,255,0.8);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 30px rgba(0,212,255,0.3);
}
.search-button {
    padding: 16px 32px;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    border: none;
    border-radius: 14px;
    color: #0f2027;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,212,255,0.4);
}
.search-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,212,255,0.6);
    filter: brightness(1.1);
}
.search-button:active {
    transform: translateY(0);
}
.search-hint {
    margin-top: 15px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.45);
}

/* === ОБЩАЯ СТАТИСТИКА === */
.stats-section {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
    animation: fadeInUp 0.9s ease;
}
.stats-section h2 {
    font-size: 1.4rem; margin-bottom: 25px; text-align: center;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 900;
    letter-spacing: 1px;
}
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}
.stat-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 22px 15px;
    text-align: center;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}
.stat-card::before {
    content: ''; position: absolute; top: 0; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%);
    opacity: 0.5;
}
.stat-card:hover {
    transform: translateY(-4px);
    background: linear-gradient(135deg, rgba(0,212,255,0.12) 0%, rgba(0,212,255,0.04) 100%);
    border-color: rgba(0,212,255,0.4);
    box-shadow: 0 10px 30px rgba(0,212,255,0.2);
}
.stat-icon { font-size: 2rem; margin-bottom: 10px; }
.stat-value {
    font-size: 1.8rem; font-weight: 900;
    color: #00d4ff;
    line-height: 1.1;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
    word-break: break-word;
}
.stat-value.small { font-size: 1.15rem; }
.stat-value.gold { color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
.stat-value.purple { color: #c4b5fd; text-shadow: 0 0 20px rgba(167,139,250,0.5); }
.stat-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
}

/* === ЗАГЛУШКА === */
.loading {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255,255,255,0.5);
    font-size: 1rem;
}
.loading::after {
    content: '';
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid rgba(0,212,255,0.3);
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 10px;
    vertical-align: middle;
}

/* === ПОДВАЛ === */
.footer {
    text-align: center; margin-top: 25px; padding: 15px;
    font-size: 0.85rem; color: rgba(255,255,255,0.4);
}
.footer a { color: #00d4ff; text-decoration: none; transition: color 0.3s; }
.footer a:hover { color: #00ffa3; }

/* === АНИМАЦИИ === */
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-25px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

/* === АДАПТИВ === */
@media (max-width: 600px) {
    body { padding: 8px; padding-top: 12px; }
    .header h1 { font-size: 2rem; }
    .header .subtitle { font-size: 0.9rem; }
    .search-form { padding: 20px; border-radius: 16px; }
    .search-form h2 { font-size: 1.1rem; }
    .search-input-wrap { flex-direction: column; }
    .search-button { width: 100%; }
    .stats-section { padding: 20px; }
    .stats-section h2 { font-size: 1.2rem; }
    .stat-value { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <div class="header">
        <h1>🎣 Рыбалка gans_mann</h1>
        <p class="subtitle">Общая статистика игры</p>
    </div>

    <!-- Форма поиска -->
    <div class="search-form">
        <h2>🔍 Найти свой инвентарь</h2>
        <div class="search-input-wrap">
            <input type="text" id="nickInput" class="search-input" placeholder="Введите ваш ник в Twitch" maxlength="50" autocomplete="off">
            <button class="search-button" id="searchBtn">Найти</button>
        </div>
        <p class="search-hint">Например: <b>gans_mann</b></p>
    </div>

    <!-- Общая статистика -->
    <div class="stats-section" id="statsSection" style="display: none;">
        <h2>📊 Общая статистика</h2>
        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <!-- Заглушка -->
    <div class="loading" id="loading">Загрузка статистики...</div>

    <!-- Подвал -->
    <div class="footer">
        <p>Сайт создан для стрима <a href="https://twitch.tv/gans_mann" target="_blank">gans_mann</a></p>
    </div>
</div>

<script>
const DATA_URL = '/data.json';

const nickInput = document.getElementById('nickInput');
const searchBtn = document.getElementById('searchBtn');

// === ПОИСК ИГРОКА ===
function goToPlayer() {
    const nick = nickInput.value.trim();
    if (!nick) {
        nickInput.focus();
        nickInput.style.borderColor = 'rgba(255,100,100,0.8)';
        setTimeout(() => nickInput.style.borderColor = 'rgba(0,212,255,0.3)', 800);
        return;
    }
    // Переход на личную страницу
    window.location.href = '/inventory?player=' + encodeURIComponent(nick);
}

searchBtn.addEventListener('click', goToPlayer);
nickInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') goToPlayer();
});

// === ЗАГРУЗКА СТАТИСТИКИ ===
fetch(DATA_URL + '?t=' + Date.now())
    .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
    })
    .then(data => {
        document.getElementById('loading').style.display = 'none';

        if (data._stats) {
            renderStats(data._stats);
        }
    })
    .catch(err => {
        console.error(err);
        document.getElementById('loading').innerHTML = 
            '<span style="color:#ff6b6b">Не удалось загрузить статистику</span>';
    });

function renderStats(stats) {
    const grid = document.getElementById('statsGrid');
    const topPlayerName = capitalizeName(stats.topPlayer || '—');
    const rarestFish = capitalizeName(stats.rarestFish || '—');

    grid.innerHTML = `
        <div class="stat-card">
            <div class="stat-icon">🐟</div>
            <div class="stat-value">${stats.totalFish}</div>
            <div class="stat-label">Рыб поймано</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-value">${stats.totalPlayers}</div>
            <div class="stat-label">Рыбаков</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🏆</div>
            <div class="stat-value small gold">@${topPlayerName}</div>
            <div class="stat-label">Лидер (${stats.topPlayerCount})</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">💎</div>
            <div class="stat-value small purple">${rarestFish}</div>
            <div class="stat-label">Самая редкая</div>
        </div>
    `;

    document.getElementById('statsSection').style.display = 'block';
}

function capitalizeName(name) {
    if (!name) return '—';
    if (name.toLowerCase().startsWith('нежить ')) {
        const base = name.substring(7);
        return base.charAt(0).toUpperCase() + base.slice(1);
    }
    return name.charAt(0).toUpperCase() + name.slice(1);
}

// Автообновление статистики каждые 30 секунд
setInterval(() => {
    fetch(DATA_URL + '?t=' + Date.now())
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            if (data && data._stats) renderStats(data._stats);
        })
        .catch(() => {});
}, 30000);
</script>
</body>
</html>
