<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвентарь рыбака</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные пузырьки */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 200, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 200, 0.06) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 1;
        }

        /* === ШАПКА === */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .header .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        /* === КАРТОЧКА ИГРОКА === */
        .player-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.6s ease;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            color: #0f2027;
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
            flex-shrink: 0;
        }

        .player-info h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .player-info .player-stats {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .player-info .player-stats span {
            color: #00ffa3;
            font-weight: 600;
        }

        /* === СТАТИСТИКА === */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 35px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .stat-box .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .stat-box .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: #00d4ff;
            line-height: 1;
            margin-bottom: 5px;
        }

        .stat-box .stat-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-box.undead .stat-value {
            color: #a78bfa;
        }

        /* === СПИСОК РЫБ === */
        .fish-section h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fish-section h3::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            border-radius: 2px;
        }

        .fish-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .fish-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .fish-item:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }

        .fish-item.undead {
            background: rgba(167, 139, 250, 0.08);
            border-color: rgba(167, 139, 250, 0.2);
        }

        .fish-item.undead:hover {
            background: rgba(167, 139, 250, 0.15);
            border-color: rgba(167, 139, 250, 0.4);
        }

        .fish-name {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .fish-name .fish-emoji {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .fish-name .fish-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fish-count {
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .fish-item.undead .fish-count {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }

        /* === ПОДВАЛ === */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            animation: fadeIn 1s ease;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #00ffa3;
        }

        /* === СОСТОЯНИЯ === */
        .loading,
        .error {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
        }

        .loading {
            color: rgba(255, 255, 255, 0.6);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        .error {
            color: #ff6b6b;
        }

        /* === АНИМАЦИИ === */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* === АДАПТИВ === */
        @media (max-width: 600px) {
            body {
                padding: 15px;
                padding-top: 30px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .player-card {
                padding: 25px;
                border-radius: 20px;
            }

            .player-header {
                flex-direction: column;
                text-align: center;
            }

            .player-info h2 {
                font-size: 1.4rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .fish-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1>🎣 Инвентарь рыбака</h1>
            <p class="subtitle">Статистика улова и коллекция</p>
        </div>

        <!-- Основная карточка -->
        <div class="player-card" id="playerCard">
            <div class="loading">Загрузка инвентаря...</div>
        </div>

        <!-- Подвал -->
        <div class="footer">
            <p>Сайт создан для стрима <a href="https://twitch.tv/gans_mann" target="_blank">gans_mann</a></p>
        </div>
    </div>

    <script>
        // === ИСТОЧНИК ДАННЫХ ===
        // '/data.json' — относительный путь, работает и на gansmann.ru, и на gans-mann.github.io
        // Так как index.html и data.json лежат в одном репозитории и отдаются одним доменом,
        // это самый надёжный вариант: никаких CORS, никаких блокировок raw.githubusercontent.com
const DATA_URL = '/data.json';

        // Получаем имя игрока из адресной строки (?player=ник)
        const urlParams = new URLSearchParams(window.location.search);
        const playerName = urlParams.get('player');

        const playerCard = document.getElementById('playerCard');

        // Если ник не указан
        if (!playerName) {
            playerCard.innerHTML = `
                <div class="error">
                    <p style="font-size: 1.3rem; margin-bottom: 10px;">🎣 Укажите ник игрока в адресе</p>
                    <p style="color: rgba(255,255,255,0.5); font-size: 0.95rem;">
                        Пример: <code style="background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px;">?player=ваш_ник</code>
                    </p>
                </div>
            `;
        } else {
            // Загружаем данные из JSON (с кеш-обходом)
            fetch(DATA_URL + '?t=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}: файл данных не найден`);
                    return response.json();
                })
                .then(data => {
                    // Ищем игрока без учёта регистра
                    const playerKey = Object.keys(data).find(
                        key => key.toLowerCase() === playerName.toLowerCase()
                    );

                    if (!playerKey) {
                        playerCard.innerHTML = `
                            <div class="error">
                                <p style="font-size: 1.3rem; margin-bottom: 10px;">Игрок не найден</p>
                                <p style="color: rgba(255,255,255,0.5);">
                                    @${playerName} ещё не ловил рыбу
                                </p>
                            </div>
                        `;
                        return;
                    }

                    const inventory = data[playerKey];
                    renderInventory(playerKey, inventory);
                })
                .catch(err => {
                    console.error('Ошибка загрузки:', err);
                    playerCard.innerHTML = `
                        <div class="error">
                            <p style="font-size: 1.3rem; margin-bottom: 10px;">Не удалось загрузить данные</p>
                            <p style="color: rgba(255,255,255,0.5);">
                                Попробуйте позже или сообщите стримеру
                            </p>
                            <p style="color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 10px;">
                                ${err.message}
                            </p>
                        </div>
                    `;
                });
        }

        // === РЕНДЕР ИНВЕНТАРЯ ===
        function renderInventory(playerName, inventory) {
            // Считаем статистику
            let totalRegular = 0;
            let totalUndead = 0;
            const regularFish = [];
            const undeadFish = [];

            for (const [fish, count] of Object.entries(inventory)) {
                if (count <= 0) continue;

                const isUndead = fish.toLowerCase().startsWith('нежить ');

                if (isUndead) {
                    totalUndead += count;
                    undeadFish.push({
                        name: fish.replace(/^нежить\s+/i, ''),
                        count: count
                    });
                } else {
                    totalRegular += count;
                    regularFish.push({ name: fish, count: count });
                }
            }

            // Сортируем по алфавиту
            regularFish.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
            undeadFish.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

            const total = totalRegular + totalUndead;
            const firstLetter = playerName.charAt(0).toUpperCase();

            let html = `
                <div class="player-header">
                    <div class="player-avatar">${firstLetter}</div>
                    <div class="player-info">
                        <h2>@${playerName}</h2>
                        <div class="player-stats">
                            Всего поймано: <span>${total}</span> рыб
                        </div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-icon">🐟</div>
                        <div class="stat-value">${totalRegular}</div>
                        <div class="stat-label">Обычные</div>
                    </div>
                    <div class="stat-box undead">
                        <div class="stat-icon">🧟</div>
                        <div class="stat-value">${totalUndead}</div>
                        <div class="stat-label">Нежить</div>
                    </div>
                </div>
            `;

            // Обычные рыбы
            if (regularFish.length > 0) {
                html += `
                    <div class="fish-section">
                        <h3>🐟 Обычные рыбы</h3>
                        <div class="fish-grid">
                            ${regularFish.map(fish => `
                                <div class="fish-item">
                                    <div class="fish-name">
                                        <span class="fish-emoji">🐟</span>
                                        <span class="fish-text">${fish.name}</span>
                                    </div>
                                    <div class="fish-count">×${fish.count}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Нежить
            if (undeadFish.length > 0) {
                html += `
                    <div class="fish-section" style="margin-top: 30px;">
                        <h3>🧟 Нежить</h3>
                        <div class="fish-grid">
                            ${undeadFish.map(fish => `
                                <div class="fish-item undead">
                                    <div class="fish-name">
                                        <span class="fish-emoji">🧟</span>
                                        <span class="fish-text">${fish.name}</span>
                                    </div>
                                    <div class="fish-count">×${fish.count}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Если инвентарь пуст
            if (regularFish.length === 0 && undeadFish.length === 0) {
                html += `
                    <div class="error" style="color: rgba(255,255,255,0.5);">
                        <p>🎣 Инвентарь пуст</p>
                    </div>
                `;
            }

            playerCard.innerHTML = html;
        }
    </script>
</body>
</html>
