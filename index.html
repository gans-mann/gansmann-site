<!DOCTYPE html>
<html lang="ru">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвентарь рыбака</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh; color: #fff; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 40px; position: relative; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0,200,255,0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,255,200,0.06) 0%, transparent 40%);
            pointer-events: none; z-index: 0;
        }
        .container { width: 100%; max-width: 900px; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 30px; animation: fadeInDown 0.6s ease; }
        .header h1 {
            font-size: 2.5rem; font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 10px; letter-spacing: -1px;
        }
        .header .subtitle { font-size: 1rem; color: rgba(255,255,255,0.6); }

        .server-stats {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 25px; margin-bottom: 25px; animation: fadeInUp 0.6s ease;
        }
        .server-stats h2 { font-size: 1.3rem; margin-bottom: 20px; color: #00d4ff; }
        .stats-grid-4 {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;
        }
        .server-stat {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 18px; text-align: center; transition: all 0.3s;
        }
        .server-stat:hover {
            background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.3); transform: translateY(-2px);
        }
        .server-stat .stat-icon { font-size: 1.8rem; margin-bottom: 8px; }
        .server-stat .stat-value {
            font-size: 1.5rem; font-weight: 900; color: #00d4ff;
            line-height: 1.2; margin-bottom: 6px; word-break: break-word;
        }
        .server-stat .stat-label {
            font-size: 0.75rem; color: rgba(255,255,255,0.5);
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
        }

        .player-card {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: fadeInUp 0.6s ease;
        }
        .player-header {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 25px; padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .player-avatar {
            width: 70px; height: 70px; border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 900; color: #0f2027;
            box-shadow: 0 8px 24px rgba(0,212,255,0.3); flex-shrink: 0;
        }
        .player-info { flex: 1; }
        .player-info h2 { font-size: 1.6rem; margin-bottom: 4px; }
        .player-info .player-stats { font-size: 0.9rem; color: rgba(255,255,255,0.6); }
        .player-info .player-stats span { color: #00ffa3; font-weight: 600; }

        .twitch-link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; background: #9146ff; color: white;
            text-decoration: none; border-radius: 10px;
            font-size: 0.85rem; font-weight: 600; transition: all 0.3s;
        }
        .twitch-link:hover { background: #7a2ee0; transform: translateY(-1px); }

        .collection-progress {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-bottom: 25px;
        }
        .progress-block {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 15px;
        }
        .progress-block.undead {
            background: rgba(167,139,250,0.06); border-color: rgba(167,139,250,0.2);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; font-size: 0.85rem; font-weight: 600;
        }
        .progress-header .label { color: rgba(255,255,255,0.7); }
        .progress-header .count { color: #00d4ff; font-weight: 700; }
        .progress-block.undead .progress-header .count { color: #a78bfa; }
        .progress-bar {
            height: 8px; background: rgba(255,255,255,0.08);
            border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #00d4ff, #00ffa3);
            border-radius: 4px; transition: width 0.8s ease;
        }
        .progress-block.undead .progress-fill {
            background: linear-gradient(90deg, #a78bfa, #c4b5fd);
        }

        .records-section {
            background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.2);
            border-radius: 14px; padding: 18px; margin-bottom: 25px;
        }
        .records-section h3 {
            font-size: 1rem; color: #ffd700; margin-bottom: 12px;
        }
        .record-list { display: flex; flex-direction: column; gap: 8px; }
        .record-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: rgba(255,255,255,0.03);
            border-radius: 8px; font-size: 0.9rem;
        }
        .record-row .record-fish { font-weight: 600; }
        .record-row .record-size { color: #ffd700; font-weight: 700; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;
        }
        .stat-box:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .stat-box .stat-icon { font-size: 1.8rem; margin-bottom: 8px; }
        .stat-box .stat-value { font-size: 2rem; font-weight: 900; color: #00d4ff; line-height: 1; margin-bottom: 5px; }
        .stat-box .stat-label {
            font-size: 0.85rem; color: rgba(255,255,255,0.6);
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
        }
        .stat-box.undead .stat-value { color: #a78bfa; }

        .fish-section h3 {
            font-size: 1.1rem; font-weight: 700; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
        }
        .fish-section h3::before {
            content: ''; width: 4px; height: 18px;
            background: linear-gradient(135deg, #00d4ff, #00ffa3); border-radius: 2px;
        }
        .fish-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;
        }
        .fish-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 12px;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.3s ease; animation: fishAppear 0.4s ease backwards;
        }
        @keyframes fishAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fish-item:hover {
            background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.3); transform: translateY(-2px);
        }
        .fish-item.undead {
            background: rgba(167,139,250,0.08); border-color: rgba(167,139,250,0.2);
        }
        .fish-item.undead:hover {
            background: rgba(167,139,250,0.15); border-color: rgba(167,139,250,0.4);
        }

        .fish-icon {
            width: 28px; height: 28px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .fish-name {
            font-size: 0.85rem; font-weight: 600; flex: 1;
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .fish-count {
            background: rgba(0,212,255,0.15); color: #00d4ff;
            font-weight: 700; font-size: 0.8rem; padding: 3px 8px;
            border-radius: 6px; flex-shrink: 0;
        }
        .fish-item.undead .fish-count {
            background: rgba(167,139,250,0.2); color: #a78bfa;
        }

        .last-update {
            text-align: center; margin-top: 20px;
            font-size: 0.8rem; color: rgba(255,255,255,0.4);
        }
        .last-update .update-time { color: #00d4ff; font-weight: 600; }

        .footer {
            text-align: center; margin-top: 20px; padding: 20px;
            font-size: 0.85rem; color: rgba(255,255,255,0.4);
        }
        .footer a { color: #00d4ff; text-decoration: none; }

        .loading, .error { text-align: center; padding: 50px 20px; font-size: 1rem; }
        .loading { color: rgba(255,255,255,0.6); }
        .error { color: #ff6b6b; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

            body { padding: 15px; padding-top: 20px; }
            .header h1 { font-size: 1.8rem; }
            .player-card { padding: 20px; border-radius: 18px; }
            .player-header { flex-direction: column; text-align: center; }
            .player-info h2 { font-size: 1.3rem; }
            .collection-progress { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
            .fish-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>

        // === ПИКСЕЛЬНЫЕ ИКОНКИ (16x16 SVG) ===
        function px(rows) {
            const colors = {
                'K': '#1a1a1a', // чёрный контур
                'B': '#4a90d9', // синий
                'D': '#2a5a8a', // тёмно-синий
                'L': '#6ab0f0', // светло-синий
                'G': '#5a7a3a', // зелёный (щука)
                'H': '#6b8a4a',
                'O': '#d97645', // оранжевый (форель)
                'P': '#e8875a',
                'R': '#c0392b', // красный
                'Y': '#f4c430', // жёлтый
                'W': '#ffffff', // белый
                'A': '#8b6f47', // коричневый
                'S': '#a0a0a0', // серый
                'T': '#5a5a5a', // тёмно-серый
                'N': '#2c1810', // тёмно-коричневый (сом)
                'M': '#f5f5dc', // бежевый
                'C': '#a78bfa', // фиолетовый (нежить)
                'E': '#7c3aed', // тёмно-фиолетовый
                'Z': '#10b981', // зелёный яркий
                'F': '#059669'  // тёмно-зелёный
            };
            const scale = 1;
            const size = 16;
            let rects = '';
            for (let y = 0; y < rows.length; y++) {
                let x = 0;
                const row = rows[y];
                while (x < row.length) {
                    const ch = row[x];
                    if (ch === '.') { x++; continue; }
                    let len = 1;
                    while (x + len < row.length && row[x + len] === ch) len++;
                    const color = colors[ch] || '#888';
                    rects += `<rect x="${x*scale}" y="${y*scale}" width="${len*scale}" height="${scale}" fill="${color}"/>`;
                    x += len;
                }
            }
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">${rects}</svg>`
            );

        // Получение иконки для рыбы
        function getFishIcon(fishName) {
            const isUndead = fishName.toLowerCase().startsWith('нежить ');
            const baseName = isUndead ? fishName.substring(7).trim() : fishName;

            // Ищем иконку для базовой рыбы
            for (const key in FISH_ICONS) {
                if (key.toLowerCase() === baseName.toLowerCase()) {
                    return FISH_ICONS[key];
                }
            }

            // Если не нашли — возвращаем общую
            return FISH_ICONS['Плотва'];
        }

        // Загрузка данных
        const urlParams = new URLSearchParams(window.location.search);
        const playerName = urlParams.get('player');
        const playerCard = document.getElementById('playerCard');

        if (!playerName) {
            playerCard.innerHTML = `
                <div class="error">
                    <p style="font-size: 1.2rem; margin-bottom: 10px;">🎣 Укажите ник игрока в адресе</p>
                    <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">
                        Пример: <code style="background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px;">?player=ваш_ник</code>
                    </p>
                </div>
            `;
        } else {
            fetch(DATA_URL + '?t=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    // Время обновления
                    if (data._lastUpdate) {
                        document.getElementById('updateTime').textContent = data._lastUpdate;
                        document.getElementById('lastUpdate').style.display = 'block';
                    }

                    // Статистика сервера
                    if (data._stats) {
                        renderServerStats(data._stats);
                    }

                    // Личные рекорды
                    if (data._personalRecords) {
                        window._personalRecords = data._personalRecords;
                    }

                    // Игрок
                    const playerKey = Object.keys(data).find(
                        key => !key.startsWith('_') && key.toLowerCase() === playerName.toLowerCase()
                    );

                    if (!playerKey) {
                        playerCard.innerHTML = `
                            <div class="error">
                                <p style="font-size: 1.2rem; margin-bottom: 10px;">Игрок не найден</p>
                                <p style="color: rgba(255,255,255,0.5);">@${playerName} ещё не ловил рыбу</p>
                            </div>
                        `;
                        return;
                    }

                    renderInventory(playerKey, data[playerKey]);
                })
                .catch(err => {
                    console.error(err);
                    playerCard.innerHTML = `
                        <div class="error">
                            <p style="font-size: 1.2rem; margin-bottom: 10px;">Не удалось загрузить данные</p>
                            <p style="color: rgba(255,255,255,0.5);">Попробуйте позже</p>
                            <p style="color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 10px;">${err.message}</p>
                        </div>
                    `;
                });
        }

        function renderServerStats(stats) {
            const grid = document.getElementById('serverStatsGrid');
            const topPlayerName = capitalizeFishName(stats.topPlayer || '');

            grid.innerHTML = `
                <div class="server-stat">
                    <div class="stat-icon">🐟</div>
                    <div class="stat-value">${stats.totalFish}</div>
                    <div class="stat-label">Рыб всего</div>
                </div>
                <div class="server-stat">
                    <div class="stat-icon">👥</div>
                    <div class="stat-value">${stats.totalPlayers}</div>
                    <div class="stat-label">Рыбаков</div>
                </div>
                <div class="server-stat">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-value" style="font-size: 1.1rem;">@${topPlayerName}</div>
                    <div class="stat-label">Лидер (${stats.topPlayerCount})</div>
                </div>
                <div class="server-stat">
                    <div class="stat-icon">💎</div>
                    <div class="stat-value" style="font-size: 1.1rem;">${capitalizeFishName(stats.rarestFish || '—')}</div>
                    <div class="stat-label">Самая редкая</div>
                </div>
            `;
            document.getElementById('serverStats').style.display = 'block';
        }

        function capitalizeFishName(name) {
            if (!name) return '';
            if (name.toLowerCase().startsWith('нежить ')) {
                const base = name.substring(7);
                return 'Нежить ' + base.charAt(0).toUpperCase() + base.slice(1);
            }
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        function renderInventory(playerName, inventory) {
            let totalRegular = 0;
            let totalUndead = 0;
            const regularFish = [];
            const undeadFish = [];
            const regularSet = new Set();
            const undeadSet = new Set();

            for (const [fish, count] of Object.entries(inventory)) {
                if (count <= 0) continue;
                const isUndead = fish.toLowerCase().startsWith('нежить ');
                const baseFish = isUndead ? fish.substring(7).trim() : fish;

                if (isUndead) {
                    totalUndead += count;
                    undeadFish.push({ name: fish, count });
                    undeadSet.add(baseFish.toLowerCase().replace('ё', 'е'));
                } else {
                    totalRegular += count;
                    regularFish.push({ name: fish, count });
                    regularSet.add(baseFish.toLowerCase().replace('ё', 'е'));
                }
            }

            regularFish.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
            undeadFish.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

            const total = totalRegular + totalUndead;
            const firstLetter = playerName.charAt(0).toUpperCase();

            // Подсчёт коллекции
            let regularCaught = 0;
            let undeadCaught = 0;
            ALL_FISH.forEach(fish => {
                const normalized = fish.toLowerCase().replace('ё', 'е');
                if (regularSet.has(normalized)) regularCaught++;
                if (undeadSet.has(normalized)) undeadCaught++;
            });
            const totalFishTypes = ALL_FISH.length;
            const regularPercent = Math.round(regularCaught / totalFishTypes * 100);
            const undeadPercent = Math.round(undeadCaught / totalFishTypes * 100);

            // Личные рекорды
            let recordsHtml = '';
            if (window._personalRecords) {
                const playerKey = playerName.toLowerCase();
                const personalRecords = [];
                for (const [key, size] of Object.entries(window._personalRecords)) {
                    const [recPlayer, recFish] = key.split('|');
                    if (recPlayer === playerKey) {
                        personalRecords.push({ fish: recFish, size });
                    }
                }
                personalRecords.sort((a, b) => b.size - a.size);
                const topRecords = personalRecords.slice(0, 5);

                if (topRecords.length > 0) {
                    recordsHtml = `
                        <div class="records-section">
                            <h3>🏆 Личные рекорды</h3>
                            <div class="record-list">
                                ${topRecords.map(r => `
                                    <div class="record-row">
                                        <span class="record-fish">${capitalizeFishName(r.fish)}</span>
                                        <span class="record-size">${r.size} см</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            let html = `
                <div class="player-header">
                    <div class="player-avatar">${firstLetter}</div>
                    <div class="player-info">
                        <h2>@${playerName}</h2>
                        <div class="player-stats">
                            Всего поймано: <span>${total}</span> рыб
                        </div>
                    </div>
                    <a href="https://twitch.tv/${playerName}" target="_blank" class="twitch-link">
                        📺 Twitch
                    </a>
                </div>

                <div class="collection-progress">
                    <div class="progress-block">
                        <div class="progress-header">
                            <span class="label">🐟 Обычные</span>
                            <span class="count">${regularCaught} / ${totalFishTypes}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${regularPercent}%"></div>
                        </div>
                    </div>
                    <div class="progress-block undead">
                        <div class="progress-header">
                            <span class="label">🧟 Нежить</span>
                            <span class="count">${undeadCaught} / ${totalFishTypes}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${undeadPercent}%"></div>
                        </div>
                    </div>
                </div>

                ${recordsHtml}

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-icon">🐟</div>
                        <div class="stat-value">${totalRegular}</div>
                        <div class="stat-label">Обычные</div>
                    </div>
                    <div class="stat-box undead">
                        <div class="stat-icon">🧟</div>
                        <div class="stat-value">${totalUndead}</div>
                        <div class="stat-label">Нежить</div>
                    </div>
                </div>
            `;

            let delay = 0;
            if (regularFish.length > 0) {
                html += `
                    <div class="fish-section">
                        <h3>🐟 Обычные рыбы</h3>
                        <div class="fish-grid">
                            ${regularFish.map((fish, i) => {
                                const icon = getFishIcon(fish.name);
                                return `
                                    <div class="fish-item" style="animation-delay: ${delay + i * 20}ms">
                                        <img src="${icon}" alt="${fish.name}" class="fish-icon">
                                        <span class="fish-name">${fish.name}</span>
                                        <span class="fish-count">×${fish.count}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                delay += regularFish.length * 20;
            }

            if (undeadFish.length > 0) {
                html += `
                    <div class="fish-section" style="margin-top: 25px;">
                        <h3>🧟 Нежить</h3>
                        <div class="fish-grid">
                            ${undeadFish.map((fish, i) => {
                                const icon = getFishIcon(fish.name);
                                return `
                                    <div class="fish-item undead" style="animation-delay: ${delay + i * 20}ms">
                                        <img src="${icon}" alt="${fish.name}" class="fish-icon">
                                        <span class="fish-name">${capitalizeFishName(fish.name)}</span>
                                        <span class="fish-count">×${fish.count}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            if (regularFish.length === 0 && undeadFish.length === 0) {
                html += `
                    <div class="error" style="color: rgba(255,255,255,0.5);">
                        <p>🎣 Инвентарь пуст</p>
                    </div>
                `;
            }

            playerCard.innerHTML = html;
        }
    </script>
