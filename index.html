<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Инвентарь рыбаков</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        h1 { color: #4CAF50; }
        .player { background: #2a2a2a; margin: 10px 0; padding: 15px; border-radius: 8px; }
        .player-name { font-size: 1.2em; font-weight: bold; color: #ffd700; margin-bottom: 10px; }
        .fish-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .fish-item { background: #3a3a3a; padding: 5px 10px; border-radius: 5px; font-size: 0.9em; }
        .error { color: #ff6b6b; background: #3a1a1a; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🎣 Инвентарь рыбаков</h1>
    <div id="content">Загрузка данных...</div>

    <script>
        // URL твоего data.json на GitHub (raw версия!)
        const DATA_URL = 'https://raw.githubusercontent.com/gans-mann/gansmann-site/main/data.json';

        async function loadInventory() {
            const contentDiv = document.getElementById('content');
            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                // Очищаем контейнер
                contentDiv.innerHTML = '';
                
                // Перебираем игроков
                for (const [playerName, fishes] of Object.entries(data)) {
                    const playerDiv = document.createElement('div');
                    playerDiv.className = 'player';
                    
                    const nameSpan = document.createElement('div');
                    nameSpan.className = 'player-name';
                    nameSpan.textContent = playerName;
                    playerDiv.appendChild(nameSpan);
                    
                    const fishList = document.createElement('div');
                    fishList.className = 'fish-list';
                    
                    for (const [fishName, count] of Object.entries(fishes)) {
                        const fishSpan = document.createElement('span');
                        fishSpan.className = 'fish-item';
                        fishSpan.textContent = `${fishName}: ${count} шт.`;
                        fishList.appendChild(fishSpan);
                    }
                    
                    playerDiv.appendChild(fishList);
                    contentDiv.appendChild(playerDiv);
                }
                
                if (Object.keys(data).length === 0) {
                    contentDiv.innerHTML = '<p>Инвентарь пуст.</p>';
                }
                
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
                console.error('Ошибка:', error);
            }
        }

        loadInventory();
    </script>
</body>
</html>
