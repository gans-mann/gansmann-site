<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Рыбалка gans_mann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh; color: #fff; padding: 10px;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 20px; position: relative; overflow-x: hidden;
}
body::before {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(0,200,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,200,0.06) 0%, transparent 40%);
    pointer-events: none; z-index: 0;
}
.container { width: 100%; max-width: 1100px; position: relative; z-index: 1; }

/* === ШАПКА === */
.header { text-align: center; margin-bottom: 25px; animation: fadeInDown 0.7s ease; }
.header h1 {
    font-size: 2.8rem; font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px; letter-spacing: -1.5px;
}
.header .subtitle { font-size: 1rem; color: rgba(255,255,255,0.6); }

/* === ФОРМА ПОИСКА === */
.search-form {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 25px 30px;
    margin-bottom: 25px;
    text-align: center;
    animation: fadeInUp 0.7s ease;
}
.search-form h2 { font-size: 1.2rem; margin-bottom: 15px; color: #00d4ff; font-weight: 700; }
.search-input-wrap { display: flex; gap: 12px; max-width: 500px; margin: 0 auto; }
.search-input {
    flex: 1; padding: 15px 20px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(0,212,255,0.3);
    border-radius: 14px; color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem; font-weight: 600;
    transition: all 0.3s; outline: none;
}
.search-input::placeholder { color: rgba(255,255,255,0.4); font-weight: 500; }
.search-input:focus {
    border-color: rgba(0,212,255,0.8);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 30px rgba(0,212,255,0.3);
}
.search-button {
    padding: 15px 30px;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    border: none; border-radius: 14px;
    color: #0f2027;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem; font-weight: 900;
    cursor: pointer; transition: all 0.3s;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,212,255,0.4);
}
.search-button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,212,255,0.6); filter: brightness(1.1); }
.search-hint { margin-top: 12px; font-size: 0.82rem; color: rgba(255,255,255,0.45); }

/* === СЕКЦИЯ === */
.section {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
    animation: fadeInUp 0.9s ease;
}
.section h2 {
    font-size: 1.3rem; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
    font-weight: 900; letter-spacing: 0.5px;
}
.section h2::before {
    content: ''; width: 4px; height: 20px;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    border-radius: 2px;
}

/* === ОБЩАЯ СТАТИСТИКА === */
.stats-mini {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 25px;
}
.stat-mini {
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    transition: all 0.3s;
}
.stat-mini:hover {
    transform: translateY(-3px);
    border-color: rgba(0,212,255,0.5);
    background: linear-gradient(135deg, rgba(0,212,255,0.12) 0%, rgba(0,212,255,0.04) 100%);
}
.stat-mini .stat-icon { font-size: 1.6rem; margin-bottom: 6px; }
.stat-mini .stat-value {
    font-size: 1.7rem; font-weight: 900;
    color: #00d4ff; line-height: 1;
    margin-bottom: 5px;
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
}
.stat-mini .stat-label {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
}

/* === ТОП-3 ИГРОКОВ === */
.top-players {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}
.top-player-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px 15px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: all 0.35s;
}
.top-player-card::before {
    content: ''; position: absolute; top: 0; left: 10%; right: 10%;
    height: 2px; opacity: 0.6;
    background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%);
}
.top-player-card:hover { transform: translateY(-4px); }
.top-player-card .rank {
    font-size: 2rem; margin-bottom: 8px;
    line-height: 1;
    filter: drop-shadow(0 0 8px currentColor);
}
.top-player-card .player-name {
    font-size: 1rem; font-weight: 900;
    margin-bottom: 6px;
    word-break: break-word;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.top-player-card .player-count {
    font-size: 1.4rem; font-weight: 900;
    line-height: 1;
    text-shadow: 0 0 15px currentColor;
}
.top-player-card .player-count-label {
    font-size: 0.68rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-top: 4px;
}
.top-player-card.rank-1 {
    color: #ffd700;
    border-color: rgba(255,215,0,0.6);
    background: linear-gradient(135deg, rgba(255,200,50,0.15) 0%, rgba(200,140,0,0.05) 100%);
    box-shadow: 0 0 30px rgba(255,215,0,0.2);
}
.top-player-card.rank-1 .player-count { color: #ffd700; }
.top-player-card.rank-2 {
    color: #d8d8d8;
    border-color: rgba(200,200,200,0.5);
    background: linear-gradient(135deg, rgba(200,200,200,0.12) 0%, rgba(150,150,150,0.04) 100%);
}
.top-player-card.rank-2 .player-count { color: #d8d8d8; }
.top-player-card.rank-3 {
    color: #cd7f32;
    border-color: rgba(205,127,50,0.5);
    background: linear-gradient(135deg, rgba(205,127,50,0.12) 0%, rgba(150,90,30,0.04) 100%);
}
.top-player-card.rank-3 .player-count { color: #cd7f32; }

/* === РЕКОРДЫ РАЗМЕРОВ === */
.records-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 8px;
}
/* === РЕКОРДЫ РАЗМЕРОВ === */
.records-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 8px;
}

.record-card {
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    border: 2px solid transparent;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
}

/* === ОБЫЧНАЯ — серая === */
.record-card.rarity-common {
    color: rgba(140, 180, 220, 0.7);
    border-color: rgba(120, 160, 200, 0.45);
    background: linear-gradient(135deg, rgba(70, 110, 150, 0.28) 0%, rgba(40, 70, 100, 0.15) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
}
.record-card.rarity-common:hover {
    border-color: rgba(170, 210, 250, 0.85);
    background: linear-gradient(135deg, rgba(100, 150, 200, 0.4) 0%, rgba(60, 100, 140, 0.22) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(120, 180, 230, 0.3);
}

/* === РЕДКАЯ — голубая === */
.record-card.rarity-rare {
    color: rgba(0, 212, 255, 0.8);
    border-color: rgba(0, 212, 255, 0.55);
    background: linear-gradient(135deg, rgba(0, 180, 255, 0.28) 0%, rgba(0, 120, 180, 0.15) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 14px rgba(0,212,255,0.2);
}
.record-card.rarity-rare:hover {
    border-color: rgba(100, 235, 255, 1);
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.45) 0%, rgba(0, 150, 220, 0.25) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(0, 212, 255, 0.45);
}

/* === ЭПИЧЕСКАЯ — фиолетовая === */
.record-card.rarity-epic {
    color: rgba(200, 180, 255, 0.85);
    border-color: rgba(167, 139, 250, 0.6);
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.3) 0%, rgba(120, 90, 200, 0.15) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 18px rgba(167,139,250,0.25);
}
.record-card.rarity-epic:hover {
    border-color: rgba(220, 205, 255, 1);
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.48) 0%, rgba(140, 110, 220, 0.28) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(167, 139, 250, 0.5);
}

/* === ЛЕГЕНДАРНАЯ — золотая === */
.record-card.rarity-legendary {
    color: rgba(255, 230, 130, 0.9);
    border-color: rgba(255, 215, 0, 0.75);
    background: linear-gradient(135deg, rgba(255, 200, 50, 0.35) 0%, rgba(200, 140, 0, 0.18) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 24px rgba(255,215,0,0.3);
    animation: legendaryPulse 3s ease-in-out infinite;
}
@keyframes legendaryPulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 24px rgba(255,215,0,0.3); }
    50% { box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 40px rgba(255,215,0,0.55); }
}
.record-card.rarity-legendary:hover {
    border-color: rgba(255, 245, 150, 1);
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.5) 0%, rgba(220, 160, 20, 0.3) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 40px rgba(255, 215, 0, 0.6);
}

/* === НЕЖИТЬ — мрачная зелёная === */
.record-card.undead.rarity-common {
    color: rgba(150, 170, 120, 0.8);
    border-color: rgba(120, 130, 90, 0.55);
    background: linear-gradient(135deg, rgba(70, 80, 60, 0.4) 0%, rgba(40, 50, 35, 0.2) 100%);
}
.record-card.undead.rarity-common:hover {
    border-color: rgba(180, 200, 140, 0.9);
    background: linear-gradient(135deg, rgba(100, 120, 80, 0.55) 0%, rgba(60, 75, 50, 0.3) 100%);
}
.record-card.undead.rarity-rare {
    color: rgba(130, 180, 200, 0.85);
    border-color: rgba(100, 140, 160, 0.65);
    background: linear-gradient(135deg, rgba(60, 90, 110, 0.4) 0%, rgba(40, 60, 80, 0.2) 100%);
}
.record-card.undead.rarity-rare:hover {
    border-color: rgba(160, 210, 240, 0.95);
    background: linear-gradient(135deg, rgba(90, 130, 160, 0.55) 0%, rgba(60, 90, 110, 0.3) 100%);
}
.record-card.undead.rarity-epic {
    color: rgba(160, 140, 190, 0.85);
    border-color: rgba(120, 100, 140, 0.7);
    background: linear-gradient(135deg, rgba(80, 60, 100, 0.4) 0%, rgba(50, 40, 70, 0.2) 100%);
}
.record-card.undead.rarity-epic:hover {
    border-color: rgba(200, 180, 230, 0.95);
    background: linear-gradient(135deg, rgba(120, 95, 150, 0.55) 0%, rgba(80, 65, 110, 0.3) 100%);
}
.record-card.undead.rarity-legendary {
    color: rgba(200, 180, 120, 0.9);
    border-color: rgba(160, 140, 70, 0.8);
    background: linear-gradient(135deg, rgba(110, 90, 50, 0.42) 0%, rgba(70, 55, 30, 0.22) 100%);
    animation: undeadLegendaryPulse 3s ease-in-out infinite;
}
@keyframes undeadLegendaryPulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 26px rgba(160,140,70,0.3); }
    50% { box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 42px rgba(160,140,70,0.55); }
}
.record-card.undead.rarity-legendary:hover {
    border-color: rgba(230, 210, 120, 1);
    background: linear-gradient(135deg, rgba(140, 120, 70, 0.58) 0%, rgba(95, 80, 45, 0.32) 100%);
}

/* === ИКОНКА РЫБЫ === */
.record-icon {
    width: 36px;
    height: 36px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    transition: transform 0.3s;
}
.record-card:hover .record-icon {
    transform: scale(1.15);
}

/* === ТЕКСТ === */
.record-fish {
    font-size: 0.85rem;
    font-weight: 700;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.record-size-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    flex-shrink: 0;
}
.record-size {
    font-size: 1rem;
    font-weight: 900;
    color: #ffd700;
    line-height: 1;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
}
.record-holder {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.55);
    font-weight: 600;
    margin-top: 2px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
 /* === КРАСИВАЯ ПОДСКАЗКА ПРИ НАВЕДЕНИИ === */
.record-card {
    position: relative;
    cursor: help;
}

.record-card::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: linear-gradient(135deg, rgba(20, 40, 60, 0.98) 0%, rgba(15, 30, 45, 0.98) 100%);
    border: 1.5px solid rgba(0, 212, 255, 0.6);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.75rem;
    color: #00d4ff;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 100;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0,212,255,0.3);
    letter-spacing: 0.3px;
}

.record-card::before {
    content: '';
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    border: 6px solid transparent;
    border-top-color: rgba(0, 212, 255, 0.6);
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 100;
    pointer-events: none;
}

.record-card:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(-12px);
}

.record-card:hover::before {
    opacity: 1;
}
    
/* === ЗАГЛУШКА === */
.loading {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255,255,255,0.5);
    font-size: 1rem;
}
.loading::after {
    content: '';
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid rgba(0,212,255,0.3);
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 10px;
    vertical-align: middle;
}

/* === ПОДВАЛ === */
.footer {
    text-align: center; margin-top: 20px; padding: 15px;
    font-size: 0.85rem; color: rgba(255,255,255,0.4);
}
.footer a { color: #00d4ff; text-decoration: none; transition: color 0.3s; }
.footer a:hover { color: #00ffa3; }

/* === АНИМАЦИИ === */
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-25px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }

/* === АДАПТИВ === */
@media (max-width: 700px) {
    body { padding: 8px; padding-top: 12px; }
    .header h1 { font-size: 2rem; }
    .search-form { padding: 20px; }
    .search-input-wrap { flex-direction: column; }
    .search-button { width: 100%; }
    .section { padding: 18px; }
    .section h2 { font-size: 1.1rem; }
    .top-players { grid-template-columns: 1fr; }
    .records-grid { grid-template-columns: 1fr; }
    .stat-mini .stat-value { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <div class="header">
        <h1>🎣 Рыбалка gans_mann</h1>
        <p class="subtitle">Общая статистика игры</p>
    </div>

    <!-- Форма поиска -->
    <div class="search-form">
        <h2>🔍 Найти свой инвентарь</h2>
        <div class="search-input-wrap">
            <input type="text" id="nickInput" class="search-input" placeholder="Введите ваш ник в Twitch" maxlength="50" autocomplete="off">
            <button class="search-button" id="searchBtn">Найти</button>
        </div>
        <p class="search-hint">Например: <b>gans_mann</b></p>
    </div>

    <!-- Общая статистика + топ-3 + рекорды -->
    <div class="section" id="statsSection" style="display: none;">
        <h2>📊 Общая статистика</h2>
        <div class="stats-mini" id="statsMini"></div>

        <h2 style="margin-top: 25px;">🏆 Топ-3 рыбаков за месяц</h2>
        <div class="top-players" id="topPlayers"></div>

        <h2 style="margin-top: 25px;">🏅 Рекорды размеров · Обычные рыбы</h2>
<div class="records-grid" id="recordsRegular"></div>

<h2 style="margin-top: 25px;">🧟 Рекорды размеров · Нежить</h2>
<div class="records-grid" id="recordsUndead"></div>
    </div>

    <!-- Заглушка -->
    <div class="loading" id="loading">Загрузка данных...</div>

    <!-- Подвал -->
    <div class="footer">
        <p>Сайт создан для стрима <a href="https://twitch.tv/gans_mann" target="_blank">gans_mann</a></p>
    </div>
</div>
<script src="/fish-icons.js"></script>
<script>
const DATA_URL = '/data.json';

const nickInput = document.getElementById('nickInput');
const searchBtn = document.getElementById('searchBtn');

// === ПОИСК ИГРОКА ===
function goToPlayer() {
    const nick = nickInput.value.trim();
    if (!nick) {
        nickInput.focus();
        nickInput.style.borderColor = 'rgba(255,100,100,0.8)';
        setTimeout(() => nickInput.style.borderColor = 'rgba(0,212,255,0.3)', 800);
        return;
    }
    window.location.href = '/inventory.html?player=' + encodeURIComponent(nick);
}

searchBtn.addEventListener('click', goToPlayer);
nickInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') goToPlayer(); });

// === СПИСОК ВСЕХ РЫБ ===
const ALL_FISH = [
    "Щука", "Форель", "Толстолобик", "Судак", "Сом",
    "Пескарь", "Окунь", "Налим", "Лосось", "Линь",
    "Лещ", "Краснопёрка", "Карп", "Карась", "Ёрш",
    "Уклейка", "Сазан", "Осётр", "Хариус", "Минога",
    "Голец", "Белый амур", "Сиг", "Змееголов", "Угорь",
    "Чоп", "Пиранья", "Плотва", "Язь", "Голавль"
];

// === ЗАГРУЗКА И РЕНДЕР ===
let lastDataHash = '';

function loadAndRender(silent) {
    fetch(DATA_URL + '?t=' + Date.now())
        .then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        })
        .then(data => {
            const newHash = JSON.stringify(data);
            if (silent && lastDataHash === newHash) return;
            lastDataHash = newHash;

            document.getElementById('loading').style.display = 'none';

            if (data._stats) {
                renderStatsMini(data._stats);
                renderTopPlayers(data._stats);
            }
            if (data._lifetimeCatches) {
    window._lifetimeCatches = data._lifetimeCatches;
}
            if (data._records) {
                renderRecords(data._records);
            }

            document.getElementById('statsSection').style.display = 'block';
        })
        .catch(err => {
            if (!silent) {
                console.error(err);
                document.getElementById('loading').innerHTML =
                    '<span style="color:#ff6b6b">Не удалось загрузить данные</span>';
            }
        });
}

// === ОБЩАЯ СТАТИСТИКА (2 карточки) ===
function renderStatsMini(stats) {
    const el = document.getElementById('statsMini');
    el.innerHTML = `
        <div class="stat-mini">
            <div class="stat-icon">🐟</div>
            <div class="stat-value">${stats.totalFish || 0}</div>
            <div class="stat-label">Рыб поймано</div>
        </div>
        <div class="stat-mini">
            <div class="stat-icon">👥</div>
            <div class="stat-value">${stats.totalPlayers || 0}</div>
            <div class="stat-label">Рыбаков</div>
        </div>
    `;
}

// === ТОП-3 ИГРОКОВ (за месяц, из Streamer.bot) ===
function renderTopPlayers(stats) {
    const el = document.getElementById('topPlayers');
    const top3 = (stats && stats.topPlayers) ? stats.topPlayers : [];

    if (top3.length === 0) {
        el.innerHTML = '<div style="color:rgba(255,255,255,0.5);grid-column:1/-1;text-align:center;padding:20px;">Пока нет рыбаков в этом месяце</div>';
        return;
    }

    const ranks = [
        { icon: '🥇', cls: 'rank-1' },
        { icon: '🥈', cls: 'rank-2' },
        { icon: '🥉', cls: 'rank-3' }
    ];

    el.innerHTML = top3.map((p, i) => {
        const rank = ranks[i] || ranks[2];
        return `
            <div class="top-player-card ${rank.cls}">
                <div class="rank">${rank.icon}</div>
                <div class="player-name">@${escapeHtml(p.name)}</div>
                <div class="player-count">${p.count}</div>
                <div class="player-count-label">рыб за месяц</div>
            </div>
        `;
    }).join('');
}
// === ДАННЫЕ РЫБ (редкость, размеры) ===

    'Лосось':     { min: 20, max: 120, rarity: 'epic' },
    'Уклейка':    { min: 5,  max: 15,  rarity: 'common' },
    'Плотва':     { min: 7,  max: 30,  rarity: 'common' },

    'Белый амур': { min: 30, max: 120, rarity: 'epic' },

    'Чоп':        { min: 5,  max: 30,  rarity: 'common' },

// === РЕКОРДЫ РАЗМЕРОВ (отдельно обычные и нежить) ===
function renderRecords(records) {
    const regularEl = document.getElementById('recordsRegular');
    const undeadEl = document.getElementById('recordsUndead');

    const regularRows = [];
    const undeadRows = [];

    // === ОБЫЧНЫЕ РЫБЫ ===
    for (const fish of ALL_FISH) {
        if (records[fish]) {
            const r = records[fish];
            const info = FISH_DATA[fish] || { rarity: 'common', max: 0 };
            const rarity = info.rarity || 'common';
            const maxSize = info.max || 0;
            const isTrophy = maxSize > 0 && r.size >= maxSize;
            const icon = getFishIcon(fish);

            // Счётчик "поймано за всё время"
            const lifetimeCount = getLifetimeCount(fish);

            regularRows.push(`
                <div class="record-card rarity-${rarity}" data-tooltip="🎣 Поймано за всё время: ${lifetimeCount}">
                    <img src="${icon}" alt="${escapeHtml(fish)}" class="record-icon">
                    <div class="record-fish">${escapeHtml(fish)}${isTrophy ? ' 🏆' : ''}</div>
                    <div class="record-size-block">
                        <div class="record-size">${r.size} см</div>
                        <div class="record-holder">@${escapeHtml(r.holder)}</div>
                    </div>
                </div>
            `);
        }
    }

    // === НЕЖИТЬ ===
    for (const fish of ALL_FISH) {
        const undeadFish = 'Нежить ' + fish.toLowerCase();
        if (records[undeadFish]) {
            const r = records[undeadFish];
            const info = FISH_DATA[fish] || { rarity: 'common', max: 0 };
            const rarity = info.rarity || 'common';
            const maxSize = info.max || 0;
            const isTrophy = maxSize > 0 && r.size >= maxSize;
            const icon = getFishIcon(undeadFish);

            const lifetimeCount = getLifetimeCount(undeadFish);

            undeadRows.push(`
                <div class="record-card undead rarity-${rarity}" data-tooltip="🧟 Поймано за всё время: ${lifetimeCount}">
                    <img src="${icon}" alt="${escapeHtml(fish)}" class="record-icon">
                    <div class="record-fish">${escapeHtml(fish)}${isTrophy ? ' 🏆' : ''}</div>
                    <div class="record-size-block">
                        <div class="record-size">${r.size} см</div>
                        <div class="record-holder">@${escapeHtml(r.holder)}</div>
                    </div>
                </div>
            `);
        }
    }

    // Рендер обычных
    if (regularRows.length === 0) {
        regularEl.innerHTML = '<div style="color:rgba(255,255,255,0.5);text-align:center;grid-column:1/-1;">Пока нет рекордов</div>';
    } else {
        regularEl.innerHTML = regularRows.join('');
    }

    // Рендер нежити
    if (undeadRows.length === 0) {
        undeadEl.innerHTML = '<div style="color:rgba(255,255,255,0.5);text-align:center;grid-column:1/-1;">Пока нет рекордов</div>';
    } else {
        undeadEl.innerHTML = undeadRows.join('');
    }
}

// === СЧЁТЧИК ПОЙМАНО ЗА ВСЁ ВРЕМЯ ===
function getLifetimeCount(fishName) {
    if (!window._lifetimeCatches) return 0;

    const fishKey = fishName.toLowerCase();
    let total = 0;

    for (const player in window._lifetimeCatches) {
        const playerCatches = window._lifetimeCatches[player];
        if (playerCatches && playerCatches[fishKey] !== undefined) {
            total += playerCatches[fishKey];
        }
    }

    return total;
}

// === БЕЗОПАСНОСТЬ ===
function escapeHtml(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

loadAndRender(false);
