<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инвентарь рыбака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh; color: #fff; padding: 10px;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 20px; position: relative; overflow-x: hidden;
}
body::before {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(0,200,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,200,0.06) 0%, transparent 40%);
    pointer-events: none; z-index: 0;
}
.container { width: 100%; max-width: 1200px; position: relative; z-index: 1; }

.header { text-align: center; margin-bottom: 15px; }
.header h1 {
    font-size: 1.8rem; font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 3px; letter-spacing: -1px;
}
.header .subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.55); }

.server-stats {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 12px; margin-bottom: 12px;
}
.server-stats h2 { font-size: 1rem; margin-bottom: 10px; color: #00d4ff; }
.stats-grid-4 {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;
}
.server-stat {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px; text-align: center; transition: all 0.3s;
}
.server-stat:hover {
    background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.3); transform: translateY(-2px);
}
.server-stat .stat-icon { font-size: 1.2rem; margin-bottom: 3px; }
.server-stat .stat-value {
    font-size: 1.1rem; font-weight: 900; color: #00d4ff;
    line-height: 1.2; margin-bottom: 2px; word-break: break-word;
}
.server-stat .stat-label {
    font-size: 0.65rem; color: rgba(255,255,255,0.5);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}

.player-card {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 18px;
    padding: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}
.player-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.player-avatar {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 900; color: #0f2027;
    box-shadow: 0 8px 24px rgba(0,212,255,0.3); flex-shrink: 0;
}
.player-info { flex: 1; }
.player-info h2 { font-size: 1.2rem; margin-bottom: 2px; }
.player-info .player-stats { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
.player-info .player-stats span { color: #00ffa3; font-weight: 600; }

.twitch-link {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 10px; background: #9146ff; color: white;
    text-decoration: none; border-radius: 8px;
    font-size: 0.75rem; font-weight: 600; transition: all 0.3s;
}
.twitch-link:hover { background: #7a2ee0; }

.collection-progress {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.progress-block {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px;
}
.progress-block.undead {
    background: rgba(167,139,250,0.06); border-color: rgba(167,139,250,0.2);
}
.progress-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; font-size: 0.8rem; font-weight: 600;
}
.progress-header .label { color: rgba(255,255,255,0.7); }
.progress-header .count { color: #00d4ff; font-weight: 700; }
.progress-block.undead .progress-header .count { color: #a78bfa; }
.progress-bar {
    height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
}
.progress-fill {
    height: 100%; background: linear-gradient(90deg, #00d4ff, #00ffa3);
    border-radius: 3px; transition: width 0.8s ease;
}
.progress-block.undead .progress-fill {
    background: linear-gradient(90deg, #a78bfa, #c4b5fd);
}

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat-box {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px; text-align: center; transition: all 0.3s ease;
}
.stat-box .stat-icon { font-size: 1.2rem; margin-bottom: 3px; }
.stat-box .stat-value { font-size: 1.3rem; font-weight: 900; color: #00d4ff; line-height: 1; margin-bottom: 3px; }
.stat-box .stat-label {
    font-size: 0.7rem; color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}
.stat-box.undead .stat-value { color: #a78bfa; }

.fish-section h3 {
    font-size: 0.9rem; font-weight: 700; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
}
.fish-section h3::before {
    content: ''; width: 3px; height: 14px;
    background: linear-gradient(135deg, #00d4ff, #00ffa3); border-radius: 2px;
}
.fish-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 5px;
}

/* КРАСОЧНЫЕ КАРТОЧКИ РЫБ */
.fish-item {
    border-radius: 10px; padding: 7px 9px;
    display: flex; align-items: center; gap: 8px;
    transition: all 0.25s ease; cursor: pointer;
    position: relative; user-select: none;
    border: 1px solid transparent;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
}
/* Редкость: обычная — нейтральный синеватый */
.fish-item.rarity-common {
    border-color: rgba(120, 160, 200, 0.25);
    background: linear-gradient(135deg, rgba(70, 110, 150, 0.15) 0%, rgba(40, 70, 100, 0.08) 100%);
}
.fish-item.rarity-common:hover {
    background: linear-gradient(135deg, rgba(100, 150, 200, 0.25) 0%, rgba(60, 100, 140, 0.12) 100%);
    border-color: rgba(120, 180, 230, 0.5);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0, 180, 255, 0.15);
}
/* Редкость: редкая — синяя */
.fish-item.rarity-rare {
    border-color: rgba(0, 212, 255, 0.4);
    background: linear-gradient(135deg, rgba(0, 180, 255, 0.15) 0%, rgba(0, 120, 180, 0.08) 100%);
}
.fish-item.rarity-rare:hover {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.3) 0%, rgba(0, 150, 220, 0.15) 100%);
    border-color: rgba(0, 212, 255, 0.7);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
}
/* Редкость: эпическая — фиолетовая */
.fish-item.rarity-epic {
    border-color: rgba(167, 139, 250, 0.4);
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.18) 0%, rgba(120, 90, 200, 0.08) 100%);
}
.fish-item.rarity-epic:hover {
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.35) 0%, rgba(140, 110, 220, 0.18) 100%);
    border-color: rgba(167, 139, 250, 0.7);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(167, 139, 250, 0.3);
}
/* Редкость: легендарная — золотая */
.fish-item.rarity-legendary {
    border-color: rgba(255, 215, 0, 0.5);
    background: linear-gradient(135deg, rgba(255, 200, 50, 0.2) 0%, rgba(200, 140, 0, 0.08) 100%);
}
.fish-item.rarity-legendary:hover {
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.35) 0%, rgba(220, 160, 20, 0.15) 100%);
    border-color: rgba(255, 215, 0, 0.8);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(255, 215, 0, 0.35);
}
/* Нежить — фиолетовый оттенок поверх всего */
.fish-item.undead {
    filter: hue-rotate(20deg);
}
.fish-item.undead.rarity-common {
    border-color: rgba(167, 139, 250, 0.4);
    background: linear-gradient(135deg, rgba(120, 90, 200, 0.18) 0%, rgba(80, 60, 150, 0.08) 100%);
}
.fish-item.undead.rarity-common:hover {
    background: linear-gradient(135deg, rgba(140, 110, 220, 0.3) 0%, rgba(100, 80, 170, 0.15) 100%);
    border-color: rgba(167, 139, 250, 0.7);
}

.fish-item.active {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3);
}

.fish-icon {
    width: 32px; height: 32px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
}

.fish-name {
    font-size: 0.78rem; font-weight: 600; flex: 1;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fish-count {
    background: rgba(0,212,255,0.2); color: #00d4ff;
    font-weight: 700; font-size: 0.72rem; padding: 2px 6px;
    border-radius: 5px; flex-shrink: 0;
}
.fish-item.rarity-epic .fish-count { background: rgba(167,139,250,0.25); color: #c4b5fd; }
.fish-item.rarity-legendary .fish-count { background: rgba(255,215,0,0.25); color: #ffd700; }
.fish-item.undead .fish-count { background: rgba(167,139,250,0.25); color: #c4b5fd; }

/* === МОДАЛЬНАЯ КАРТОЧКА РЫБЫ === */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 20px;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }

.fish-modal {
    background: linear-gradient(135deg, rgba(30, 50, 70, 0.98), rgba(20, 35, 50, 0.98));
    border-radius: 20px;
    padding: 25px;
    max-width: 420px;
    width: 100%;
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    position: relative;
    transform: scale(0.9);
    transition: transform 0.25s ease;
}
.modal-overlay.show .fish-modal { transform: scale(1); }

.fish-modal.rarity-rare { border-color: rgba(0, 212, 255, 0.5); box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(0,212,255,0.2); }
.fish-modal.rarity-epic { border-color: rgba(167, 139, 250, 0.5); box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(167,139,250,0.2); }
.fish-modal.rarity-legendary { border-color: rgba(255, 215, 0, 0.6); box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 60px rgba(255,215,0,0.3); }

.modal-close {
    position: absolute; top: 12px; right: 12px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none; color: #fff;
    font-size: 1.2rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,80,80,0.4); transform: rotate(90deg); }

.modal-fish-icon-wrap {
    display: flex; justify-content: center; align-items: center;
    margin-bottom: 15px;
    padding: 20px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    border-radius: 16px;
    position: relative;
}
.modal-fish-icon {
    width: 128px; height: 128px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
    animation: fishSwim 3s ease-in-out infinite;
}
@keyframes fishSwim {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-6px) scaleX(1); }
}

.modal-fish-name {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 900;
    margin-bottom: 3px;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.modal-fish-name.undead {
    background: linear-gradient(135deg, #a78bfa, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.modal-rarity {
    text-align: center;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 2px;
}
.modal-rarity.rarity-common { color: #8ab4d6; }
.modal-rarity.rarity-rare { color: #00d4ff; }
.modal-rarity.rarity-epic { color: #a78bfa; }
.modal-rarity.rarity-legendary { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.5); }

.modal-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}
.modal-info-block {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}
.modal-info-block .info-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    margin-bottom: 5px;
}
.modal-info-block .info-value {
    font-size: 1.1rem;
    font-weight: 900;
    color: #00d4ff;
}
.modal-info-block .info-value.record { color: #ffd700; }
.modal-info-block .info-value.no-record { color: rgba(255,255,255,0.35); font-size: 0.85rem; font-weight: 600; }

.modal-count {
    text-align: center;
    padding: 10px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.25);
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #00d4ff;
}
.modal-count span { font-size: 1.1rem; font-weight: 900; }

.last-update {
    text-align: center; margin-top: 12px;
    font-size: 0.7rem; color: rgba(255,255,255,0.4);
}
.last-update .update-time { color: #00d4ff; font-weight: 600; }

.footer {
    text-align: center; margin-top: 12px; padding: 12px;
    font-size: 0.75rem; color: rgba(255,255,255,0.4);
}
.footer a { color: #00d4ff; text-decoration: none; }

.loading, .error { text-align: center; padding: 30px 15px; font-size: 0.95rem; }
.loading { color: rgba(255,255,255,0.6); }
.error { color: #ff6b6b; }

@media (max-width: 600px) {
    body { padding: 8px; padding-top: 12px; }
    .header h1 { font-size: 1.5rem; }
    .player-card { padding: 12px; border-radius: 14px; }
    .player-header { flex-direction: column; text-align: center; }
    .collection-progress { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr; }
    .fish-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .modal-fish-icon { width: 96px; height: 96px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎣 Инвентарь рыбака</h1>
        <p class="subtitle">Статистика улова и коллекция</p>
    </div>

    <div class="server-stats" id="serverStats" style="display: none;">
        <h2>📊 Статистика сервера</h2>
        <div class="stats-grid-4" id="serverStatsGrid"></div>
    </div>

    <div class="player-card" id="playerCard">
        <div class="loading">Загрузка инвентаря...</div>
    </div>

    <div class="last-update" id="lastUpdate" style="display: none;">
        🕒 Обновлено: <span class="update-time" id="updateTime"></span>
    </div>

    <div class="footer">
        <p>Сайт создан для стрима <a href="https://twitch.tv/gans_mann" target="_blank">gans_mann</a></p>
    </div>
</div>

<!-- Модальное окно для карточки рыбы -->
<div class="modal-overlay" id="fishModal">
    <div class="fish-modal" id="fishModalContent"></div>
</div>

<script>
// ========================================================
// ПАЛИТРЫ И ДАННЫЕ РЫБ
// ========================================================

const PALETTES = {
    pike:     { main: '#4a6b2a', dark: '#2a3f1a', light: '#6b8a4a', belly: '#8fa860', fin: '#3a5020', eye: '#ffd700', pupil: '#000', gill: '#2a3f1a', spot: '#2a3f1a' },
    trout:    { main: '#d97645', dark: '#8a4a28', light: '#e89a6a', belly: '#f0b890', fin: '#b05530', eye: '#ffd700', pupil: '#000', gill: '#8a4a28', spot: '#c0392b' },
    carp:     { main: '#8b6f3a', dark: '#5a4520', light: '#a88a50', belly: '#c4a870', fin: '#6b5028', eye: '#ffd700', pupil: '#000', gill: '#5a4520', spot: '#6b5028' },
    perch:    { main: '#5a7a3a', dark: '#3a5020', light: '#7a9a5a', belly: '#9ab070', fin: '#4a6b2a', eye: '#ffd700', pupil: '#000', gill: '#3a5020', spot: '#2a3f1a' },
    catfish:  { main: '#3a2a1a', dark: '#1a1208', light: '#5a4030', belly: '#7a6050', fin: '#2a1a0a', eye: '#f0f0f0', pupil: '#000', gill: '#1a1208', spot: '#1a1208' },
    sturgeon: { main: '#5a6a7a', dark: '#3a4a5a', light: '#7a8a9a', belly: '#a0b0c0', fin: '#4a5a6a', eye: '#ffd700', pupil: '#000', gill: '#3a4a5a', spot: '#3a4a5a' },
    piranha:  { main: '#a01818', dark: '#6a0808', light: '#c04040', belly: '#d88080', fin: '#800000', eye: '#ffd700', pupil: '#000', gill: '#6a0808', spot: '#4a0808' },
    salmon:   { main: '#e07050', dark: '#a04830', light: '#f0a080', belly: '#f8c8a8', fin: '#c05838', eye: '#ffd700', pupil: '#000', gill: '#a04830', spot: '#d06040' },
    bleak:    { main: '#c0d0e0', dark: '#8090a0', light: '#e0f0ff', belly: '#ffffff', fin: '#a0b0c0', eye: '#000', pupil: '#000', gill: '#8090a0', spot: '#a0b0c0' },
    roach:    { main: '#a0a8b0', dark: '#707880', light: '#c8d0d8', belly: '#e8f0f8', fin: '#8a9298', eye: '#ffd700', pupil: '#000', gill: '#707880', spot: '#c0392b' },
    ruffe:    { main: '#8a7a5a', dark: '#5a4a30', light: '#b0a080', belly: '#c8b8a0', fin: '#6a5a40', eye: '#ffd700', pupil: '#000', gill: '#5a4a30', spot: '#3a2a18' },
    bream:    { main: '#7a8090', dark: '#505868', light: '#a0a8b8', belly: '#c8d0e0', fin: '#606878', eye: '#ffd700', pupil: '#000', gill: '#505868', spot: '#505868' },
    chub:     { main: '#9098a0', dark: '#606870', light: '#b8c0c8', belly: '#e0e8f0', fin: '#788088', eye: '#ffd700', pupil: '#000', gill: '#606870', spot: '#606870' },
    ide:      { main: '#a08858', dark: '#6a5830', light: '#c8a878', belly: '#e0c898', fin: '#8a7040', eye: '#ffd700', pupil: '#000', gill: '#6a5830', spot: '#6a5830' },
    tench:    { main: '#5a7a4a', dark: '#3a5a2a', light: '#8aa07a', belly: '#a8b898', fin: '#4a6a3a', eye: '#ffd700', pupil: '#000', gill: '#3a5a2a', spot: '#3a5a2a' },
    zander:   { main: '#707880', dark: '#404850', light: '#98a0a8', belly: '#c0c8d0', fin: '#586068', eye: '#ffd700', pupil: '#000', gill: '#404850', spot: '#404850' },
    char:     { main: '#7a8090', dark: '#4a5060', light: '#a0a8b8', belly: '#d0d8e0', fin: '#606878', eye: '#ffd700', pupil: '#000', gill: '#4a5060', spot: '#c0392b' },

// Отрисовка рыбы 32×32 с параметром масштаба
function makeFishSVG(palette, opts, scale) {
    opts = opts || {};
    scale = scale || 1;
    const bodyLen = opts.bodyLen || 22;
    const bodyH = opts.bodyH || 12;
    const headX = opts.headX || 3;
    const bodyY = opts.bodyY || 10;
    const tailType = opts.tailType || 'fork';

    const p = palette;
    const cy = bodyY + bodyH / 2;
    const x1 = headX, x2 = headX + bodyLen;
    let s = '';

    // ТЕЛО
    s += `<rect x="${x1}" y="${bodyY+2}" width="${bodyLen}" height="${bodyH-4}" fill="${p.main}"/>`;
    s += `<rect x="${x1+1}" y="${bodyY+1}" width="${bodyLen-2}" height="${bodyH-2}" fill="${p.main}"/>`;
    s += `<rect x="${x1+2}" y="${bodyY}" width="${bodyLen-4}" height="${bodyH}" fill="${p.main}"/>`;

    // Брюхо
    s += `<rect x="${x1+2}" y="${bodyY+bodyH-3}" width="${bodyLen-4}" height="2" fill="${p.belly}"/>`;
    s += `<rect x="${x1+3}" y="${bodyY+bodyH-4}" width="${bodyLen-6}" height="1" fill="${p.belly}"/>`;

    // Верхняя тёмная полоса
    s += `<rect x="${x1+2}" y="${bodyY}" width="${bodyLen-4}" height="1" fill="${p.dark}"/>`;
    s += `<rect x="${x1+3}" y="${bodyY+1}" width="${bodyLen-6}" height="1" fill="${p.dark}"/>`;

    // Чешуя
    for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 2; j++) {
            const sx = x1 + 4 + i * 4;
            const sy = bodyY + 3 + j * 3;
            if (sx < x2 - 2 && sy < bodyY + bodyH - 2) {
                s += `<rect x="${sx}" y="${sy}" width="1" height="1" fill="${p.light}" opacity="0.6"/>`;
            }
        }
    }

    // Пятна
    if (p.spot && opts.spots) {
        for (const [sx, sy] of opts.spots) {
            s += `<rect x="${x1 + sx}" y="${bodyY + sy}" width="2" height="2" fill="${p.spot}" opacity="0.7"/>`;
        }
    }

    // Голова затемнение
    s += `<rect x="${x1}" y="${bodyY+2}" width="3" height="${bodyH-4}" fill="${p.dark}" opacity="0.4"/>`;

    // Жабры
    s += `<rect x="${x1+5}" y="${bodyY+2}" width="1" height="2" fill="${p.gill}" opacity="0.7"/>`;
    s += `<rect x="${x1+6}" y="${bodyY+3}" width="1" height="${bodyH-6}" fill="${p.gill}" opacity="0.7"/>`;
    s += `<rect x="${x1+5}" y="${bodyY+bodyH-4}" width="1" height="2" fill="${p.gill}" opacity="0.7"/>`;

    // Глаз
    s += `<rect x="${x1+2}" y="${bodyY+3}" width="3" height="3" fill="${p.eye}"/>`;
    s += `<rect x="${x1+3}" y="${bodyY+4}" width="2" height="2" fill="${p.pupil}"/>`;

    // Рот
    s += `<rect x="${x1-1}" y="${cy}" width="2" height="1" fill="${p.dark}"/>`;

    // Плавники
    s += `<rect x="${x1+6}" y="${bodyY-2}" width="1" height="2" fill="${p.fin}"/>`;
    s += `<rect x="${x1+7}" y="${bodyY-3}" width="4" height="3" fill="${p.fin}"/>`;
    s += `<rect x="${x1+11}" y="${bodyY-2}" width="3" height="2" fill="${p.fin}"/>`;
    s += `<rect x="${x1+7}" y="${bodyY-3}" width="4" height="1" fill="${p.light}" opacity="0.5"/>`;
    s += `<rect x="${x1+6}" y="${bodyY+bodyH-2}" width="4" height="3" fill="${p.fin}"/>`;
    s += `<rect x="${x1+7}" y="${bodyY+bodyH+1}" width="3" height="1" fill="${p.fin}"/>`;
    s += `<rect x="${x1+12}" y="${bodyY+bodyH-1}" width="3" height="2" fill="${p.fin}" opacity="0.8"/>`;

    // Хвост
    const tailX = x2;
    if (tailType === 'fork') {
        s += `<rect x="${tailX}" y="${cy-1}" width="2" height="2" fill="${p.main}"/>`;
        s += `<rect x="${tailX+2}" y="${cy-5}" width="2" height="4" fill="${p.fin}"/>`;
        s += `<rect x="${tailX+2}" y="${cy+1}" width="2" height="4" fill="${p.fin}"/>`;
        s += `<rect x="${tailX+4}" y="${cy-6}" width="2" height="4" fill="${p.fin}"/>`;
        s += `<rect x="${tailX+4}" y="${cy+2}" width="2" height="4" fill="${p.fin}"/>`;
        s += `<rect x="${tailX+6}" y="${cy-6}" width="1" height="3" fill="${p.dark}"/>`;
        s += `<rect x="${tailX+6}" y="${cy+3}" width="1" height="3" fill="${p.dark}"/>`;
    } else if (tailType === 'fan') {
        s += `<rect x="${tailX}" y="${cy-2}" width="3" height="4" fill="${p.main}"/>`;
        s += `<rect x="${tailX+3}" y="${cy-5}" width="3" height="10" fill="${p.fin}"/>`;
        s += `<rect x="${tailX+6}" y="${cy-6}" width="2" height="12" fill="${p.fin}"/>`;
        s += `<rect x="${tailX+8}" y="${cy-5}" width="1" height="10" fill="${p.dark}" opacity="0.5"/>`;
    } else {
        s += `<rect x="${tailX}" y="${cy-1}" width="6" height="3" fill="${p.main}"/>`;
        s += `<rect x="${tailX+5}" y="${cy-2}" width="3" height="5" fill="${p.fin}"/>`;
        s += `<rect x="${tailX+7}" y="${cy-3}" width="2" height="7" fill="${p.dark}" opacity="0.6"/>`;
    }

    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" ${scale !== 1 ? `width="${32*scale}" height="${32*scale}"` : ''}>${s}</svg>`
    );
}

// Получение данных рыбы по имени (с учётом нежити)
function getFishInfo(fishName) {
    const isUndead = fishName.toLowerCase().startsWith('нежить ');
    const baseName = isUndead ? fishName.substring(7).trim() : fishName;

    let data = null;
    for (const key in FISH_DATA) {
        if (key.toLowerCase().replace('ё', 'е') === baseName.toLowerCase().replace('ё', 'е')) {
            data = FISH_DATA[key];
            break;
        }
    }
    if (!data) data = FISH_DATA['Плотва'];

    return { isUndead, baseName, data };
}

function getFishIcon(fishName, scale) {
    const info = getFishInfo(fishName);
    if (info.isUndead) {
        return makeFishSVG(UNDEAD_PALETTE, info.data.opts, scale);
    }
    return makeFishSVG(PALETTES[info.data.palette], info.data.opts, scale);
}

const DATA_URL = '/data.json';
const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get('player');
const playerCard = document.getElementById('playerCard');

if (!playerName) {
    playerCard.innerHTML = `
        <div class="error">
            <p style="font-size: 1.1rem; margin-bottom: 8px;">🎣 Укажите ник игрока в адресе</p>
            <p style="color: rgba(255,255,255,0.5); font-size: 0.85rem;">
                Пример: <code style="background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 5px;">?player=ваш_ник</code>
            </p>
        </div>
    `;
} else {
    fetch(DATA_URL + '?t=' + Date.now())
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data._lastUpdate) {
                document.getElementById('updateTime').textContent = data._lastUpdate;
                document.getElementById('lastUpdate').style.display = 'block';
            }
            if (data._stats) renderServerStats(data._stats);
            if (data._personalRecords) window._personalRecords = data._personalRecords;

            const playerKey = Object.keys(data).find(
                key => !key.startsWith('_') && key.toLowerCase() === playerName.toLowerCase()
            );

            if (!playerKey) {
                playerCard.innerHTML = `
                    <div class="error">
                        <p style="font-size: 1.1rem; margin-bottom: 8px;">Игрок не найден</p>
                        <p style="color: rgba(255,255,255,0.5);">@${playerName} ещё не ловил рыбу</p>
                    </div>
                `;
                return;
            }

            renderInventory(playerKey, data[playerKey]);
        })
        .catch(err => {
            console.error(err);
            playerCard.innerHTML = `
                <div class="error">
                    <p style="font-size: 1.1rem; margin-bottom: 8px;">Не удалось загрузить данные</p>
                    <p style="color: rgba(255,255,255,0.5);">Попробуйте позже</p>
                    <p style="color: rgba(255,255,255,0.3); font-size: 0.75rem; margin-top: 8px;">${err.message}</p>
                </div>
            `;
        });
}

            <div class="stat-icon">🐟</div>

            <div class="stat-label">Рыб всего</div>

            <div class="stat-icon">👥</div>

            <div class="stat-value" style="font-size: 0.95rem;">@${topPlayerName}</div>
            <div class="stat-label">Лидер (${stats.topPlayerCount})</div>

function capitalizeName(name) {
    if (!name) return '';
    if (name.toLowerCase().startsWith('нежить ')) {
        const base = name.substring(7);
        return base.charAt(0).toUpperCase() + base.slice(1);
    }
    return name.charAt(0).toUpperCase() + name.slice(1);
}

function renderInventory(playerName, inventory) {
    let totalRegular = 0, totalUndead = 0;
    const regularFish = [], undeadFish = [];
    const regularSet = new Set(), undeadSet = new Set();

    for (const [fish, count] of Object.entries(inventory)) {
        if (count <= 0) continue;
        const isUndead = fish.toLowerCase().startsWith('нежить ');
        const baseFish = isUndead ? fish.substring(7).trim() : fish;

        if (isUndead) {
            totalUndead += count;
            undeadFish.push({ name: fish, displayName: baseFish, count });
            undeadSet.add(baseFish.toLowerCase().replace('ё', 'е'));
        } else {
            totalRegular += count;
            regularFish.push({ name: fish, displayName: fish, count });
            regularSet.add(baseFish.toLowerCase().replace('ё', 'е'));
        }
    }

    regularFish.sort((a, b) => a.displayName.localeCompare(b.displayName, 'ru'));
    undeadFish.sort((a, b) => a.displayName.localeCompare(b.displayName, 'ru'));

    const total = totalRegular + totalUndead;
    const firstLetter = playerName.charAt(0).toUpperCase();

    let regularCaught = 0, undeadCaught = 0;
    ALL_FISH.forEach(fish => {
        const normalized = fish.toLowerCase().replace('ё', 'е');
        if (regularSet.has(normalized)) regularCaught++;
        if (undeadSet.has(normalized)) undeadCaught++;
    });
    const totalTypes = ALL_FISH.length;
    const regularPercent = Math.round(regularCaught / totalTypes * 100);
    const undeadPercent = Math.round(undeadCaught / totalTypes * 100);

    let html = `
        <div class="player-header">
            <div class="player-avatar">${firstLetter}</div>
            <div class="player-info">
                <h2>@${playerName}</h2>
                <div class="player-stats">Всего поймано: <span>${total}</span> рыб</div>
            </div>
            <a href="https://twitch.tv/${playerName}" target="_blank" class="twitch-link">📺 Twitch</a>
        </div>

        <div class="collection-progress">
            <div class="progress-block">
                <div class="progress-header">
                    <span class="label">🐟 Обычные</span>
                    <span class="count">${regularCaught} / ${totalTypes}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${regularPercent}%"></div>
                </div>
            </div>
            <div class="progress-block undead">
                <div class="progress-header">
                    <span class="label">🧟 Нежить</span>
                    <span class="count">${undeadCaught} / ${totalTypes}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${undeadPercent}%"></div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-icon">🐟</div>
                <div class="stat-value">${totalRegular}</div>
                <div class="stat-label">Обычные</div>
            </div>
            <div class="stat-box undead">
                <div class="stat-icon">🧟</div>
                <div class="stat-value">${totalUndead}</div>
                <div class="stat-label">Нежить</div>
            </div>
        </div>
    `;

    if (regularFish.length > 0) {
        html += `
            <div class="fish-section">
                <h3>🐟 Обычные рыбы</h3>
                <div class="fish-grid">
                    ${regularFish.map(fish => {
                        const info = getFishInfo(fish.name);
                        const rarity = info.data.rarity;
                        return `
                            <div class="fish-item rarity-${rarity}" data-fish="${fish.name}" data-display="${fish.displayName}">
                                <img src="${getFishIcon(fish.name)}" alt="${fish.displayName}" class="fish-icon">
                                <span class="fish-name">${fish.displayName}</span>
                                <span class="fish-count">×${fish.count}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }

    if (undeadFish.length > 0) {
        html += `
            <div class="fish-section" style="margin-top: 12px;">
                <h3>🧟 Нежить</h3>
                <div class="fish-grid">
                    ${undeadFish.map(fish => {
                        const info = getFishInfo(fish.name);
                        const rarity = info.data.rarity;
                        return `
                            <div class="fish-item undead rarity-${rarity}" data-fish="${fish.name}" data-display="${fish.displayName}">
                                <img src="${getFishIcon(fish.name)}" alt="${fish.displayName}" class="fish-icon">
                                <span class="fish-name">${fish.displayName}</span>
                                <span class="fish-count">×${fish.count}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }

    if (regularFish.length === 0 && undeadFish.length === 0) {
        html += `<div class="error" style="color: rgba(255,255,255,0.5);"><p>🎣 Инвентарь пуст</p></div>`;
    }

    playerCard.innerHTML = html;

    // Привязка кликов
    document.querySelectorAll('.fish-item').forEach(item => {
        item.addEventListener('click', function(e) {
            e.stopPropagation();
            const fishName = this.getAttribute('data-fish');
            const count = parseInt(this.querySelector('.fish-count').textContent.replace('×', ''), 10);
            showFishModal(fishName, count);
        });
    });
}

// ========================================================
// МОДАЛЬНАЯ КАРТОЧКА РЫБЫ
// ========================================================

function showFishModal(fishName, count) {
    const info = getFishInfo(fishName);
    const data = info.data;
    const rarity = RARITY_INFO[data.rarity];

    // Личный рекорд
    const recordKey = (playerName.toLowerCase() + '|' + fishName.toLowerCase());
    let recordHtml = '';
    if (window._personalRecords && window._personalRecords[recordKey]) {
        recordHtml = `<div class="info-value record">${window._personalRecords[recordKey]} см</div>`;
    } else {
        recordHtml = `<div class="info-value no-record">не установлен</div>`;
    }

    // Название с префиксом нежити
    const displayName = info.isUndead ? '🧟 ' + info.baseName : info.baseName;

    // Большая иконка с масштабом 4 (128×128)
    const bigIcon = getFishIcon(fishName, 4);

    const modal = document.getElementById('fishModalContent');
    modal.className = 'fish-modal rarity-' + data.rarity;
    modal.innerHTML = `
        <button class="modal-close" onclick="closeFishModal()">✕</button>
        <div class="modal-fish-icon-wrap">
            <img src="${bigIcon}" alt="${info.baseName}" class="modal-fish-icon">
        </div>
        <div class="modal-fish-name ${info.isUndead ? 'undead' : ''}">${displayName}</div>
        <div class="modal-rarity rarity-${data.rarity}">${rarity.icon} ${rarity.label}</div>
        <div class="modal-info-grid">
            <div class="modal-info-block">
                <div class="info-label">Размер</div>
                <div class="info-value">${data.min}–${data.max} см</div>
            </div>
            <div class="modal-info-block">
                <div class="info-label">Твой рекорд</div>
                ${recordHtml}
            </div>
        </div>
        <div class="modal-count">Поймано: <span>${count}</span> шт.</div>
    `;

    document.getElementById('fishModal').classList.add('show');
}

function closeFishModal() {
    document.getElementById('fishModal').classList.remove('show');
}

// Закрытие по клику вне модального окна
document.getElementById('fishModal').addEventListener('click', function(e) {
    if (e.target === this) closeFishModal();
});

// Закрытие по Escape
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeFishModal();
});
</script>
