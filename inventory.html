<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инвентарь рыбака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh; color: #fff; padding: 10px;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 20px; position: relative; overflow-x: hidden;
}
body::before {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(0,200,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,255,200,0.06) 0%, transparent 40%);
    pointer-events: none; z-index: 0;
}
.container { width: 100%; max-width: 1300px; position: relative; z-index: 1; }

.header { text-align: center; margin-bottom: 15px; }
.header h1 {
    font-size: 1.9rem; font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 3px; letter-spacing: -1px;
}
.header .subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.55); }

.server-stats {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 12px; margin-bottom: 12px;
}
.server-stats h2 { font-size: 1rem; margin-bottom: 10px; color: #00d4ff; }
.stats-grid-4 {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
}
.server-stat {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px; text-align: center; transition: all 0.3s;
}
.server-stat .stat-icon { font-size: 1.2rem; margin-bottom: 3px; }
.server-stat .stat-value {
    font-size: 1.1rem; font-weight: 900; color: #00d4ff;
    line-height: 1.2; margin-bottom: 2px; word-break: break-word;
}
.server-stat .stat-label {
    font-size: 0.65rem; color: rgba(255,255,255,0.5);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}

.player-card {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 18px;
    padding: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}
.player-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.player-avatar {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #00d4ff, #00ffa3);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 900; color: #0f2027;
    box-shadow: 0 8px 24px rgba(0,212,255,0.3); flex-shrink: 0;
}
.player-info { flex: 1; }
.player-info h2 { font-size: 1.2rem; margin-bottom: 2px; }
.player-info .player-stats { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
.player-info .player-stats span { color: #00ffa3; font-weight: 600; }

.twitch-link {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 10px; background: #9146ff; color: white;
    text-decoration: none; border-radius: 8px;
    font-size: 0.75rem; font-weight: 600; transition: all 0.3s;
}
.twitch-link:hover { background: #7a2ee0; }

.collection-progress {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.progress-block {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px;
}
.progress-block.undead {
    background: rgba(120,90,60,0.08); border-color: rgba(120,90,60,0.3);
}
.progress-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; font-size: 0.8rem; font-weight: 600;
}
.progress-header .label { color: rgba(255,255,255,0.7); }
.progress-header .count { color: #00d4ff; font-weight: 700; }
.progress-block.undead .progress-header .count { color: #a8b878; }
.progress-bar {
    height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
}
.progress-fill {
    height: 100%; background: linear-gradient(90deg, #00d4ff, #00ffa3);
    border-radius: 3px; transition: width 0.8s ease;
}
.progress-block.undead .progress-fill {
    background: linear-gradient(90deg, #6a7a4a, #a8b878);
}

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat-box {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px; text-align: center;
}
.stat-box .stat-icon { font-size: 1.2rem; margin-bottom: 3px; }
.stat-box .stat-value { font-size: 1.3rem; font-weight: 900; color: #00d4ff; line-height: 1; margin-bottom: 3px; }
.stat-box .stat-label {
    font-size: 0.7rem; color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}
.stat-box.undead .stat-value { color: #a8b878; }

.fish-section h3 {
    font-size: 0.95rem; font-weight: 700; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
}
.fish-section h3::before {
    content: ''; width: 3px; height: 14px;
    background: linear-gradient(135deg, #00d4ff, #00ffa3); border-radius: 2px;
}
.fish-section.undead-section h3::before {
    background: linear-gradient(135deg, #6a7a4a, #a8b878);
}

.fish-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
}

/* === ПЛАШКИ РЫБ === */
.fish-item {
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.25s ease;
    cursor: pointer;
    position: relative; user-select: none;
    border: 2px solid transparent;
    overflow: hidden;
}

.fish-item .fish-item-inner {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 0;
}
.fish-item .fish-item-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, currentColor 20%, currentColor 80%, transparent 100%);
    opacity: 0.5;
    border-radius: 2px;
}
.fish-item .fish-item-inner::after {
    content: '';
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, currentColor 20%, currentColor 80%, transparent 100%);
    opacity: 0.5;
    border-radius: 2px;
}
.fish-item > * { position: relative; z-index: 1; }

.fish-item.rarity-common {
    color: rgba(140, 180, 220, 0.7);
    border-color: rgba(120, 160, 200, 0.45);
    background: linear-gradient(135deg, rgba(70, 110, 150, 0.28) 0%, rgba(40, 70, 100, 0.15) 50%, rgba(70, 110, 150, 0.22) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
}
.fish-item.rarity-common:hover {
    border-color: rgba(170, 210, 250, 0.85);
    background: linear-gradient(135deg, rgba(100, 150, 200, 0.4) 0%, rgba(60, 100, 140, 0.22) 50%, rgba(100, 150, 200, 0.32) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(120, 180, 230, 0.3), 0 0 20px rgba(120, 180, 230, 0.15);
}

.fish-item.rarity-rare {
    color: rgba(0, 212, 255, 0.8);
    border-color: rgba(0, 212, 255, 0.55);
    background: linear-gradient(135deg, rgba(0, 180, 255, 0.28) 0%, rgba(0, 120, 180, 0.15) 50%, rgba(0, 180, 255, 0.22) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 14px rgba(0,212,255,0.2);
}
.fish-item.rarity-rare:hover {
    border-color: rgba(100, 235, 255, 1);
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.45) 0%, rgba(0, 150, 220, 0.25) 50%, rgba(0, 212, 255, 0.35) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(0, 212, 255, 0.45), 0 0 30px rgba(0, 212, 255, 0.3);
}

.fish-item.rarity-epic {
    color: rgba(200, 180, 255, 0.85);
    border-color: rgba(167, 139, 250, 0.6);
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.3) 0%, rgba(120, 90, 200, 0.15) 50%, rgba(167, 139, 250, 0.24) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 18px rgba(167,139,250,0.25);
}
.fish-item.rarity-epic:hover {
    border-color: rgba(220, 205, 255, 1);
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.48) 0%, rgba(140, 110, 220, 0.28) 50%, rgba(167, 139, 250, 0.38) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(167, 139, 250, 0.5), 0 0 36px rgba(167, 139, 250, 0.35);
}

.fish-item.rarity-legendary {
    color: rgba(255, 230, 130, 0.9);
    border-color: rgba(255, 215, 0, 0.75);
    background: linear-gradient(135deg, rgba(255, 200, 50, 0.35) 0%, rgba(200, 140, 0, 0.18) 50%, rgba(255, 200, 50, 0.28) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 24px rgba(255,215,0,0.3);
    animation: legendaryPulse 3s ease-in-out infinite;
}
@keyframes legendaryPulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 24px rgba(255,215,0,0.3); }
    50% { box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 40px rgba(255,215,0,0.55); }
}
.fish-item.rarity-legendary:hover {
    border-color: rgba(255, 245, 150, 1);
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.5) 0%, rgba(220, 160, 20, 0.3) 50%, rgba(255, 215, 0, 0.4) 100%);
    transform: translateY(-3px);
    box-shadow: 0 8px 40px rgba(255, 215, 0, 0.6), 0 0 50px rgba(255, 215, 0, 0.45);
}

/* Нежить */
.fish-item.undead.rarity-common {
    color: rgba(150, 170, 120, 0.8);
    border-color: rgba(120, 130, 90, 0.55);
    background: linear-gradient(135deg, rgba(70, 80, 60, 0.4) 0%, rgba(40, 50, 35, 0.2) 50%, rgba(70, 80, 60, 0.3) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 12px rgba(120,140,90,0.15);
}
.fish-item.undead.rarity-common:hover {
    border-color: rgba(180, 200, 140, 0.9);
    background: linear-gradient(135deg, rgba(100, 120, 80, 0.55) 0%, rgba(60, 75, 50, 0.3) 50%, rgba(100, 120, 80, 0.4) 100%);
    box-shadow: 0 8px 24px rgba(140, 160, 100, 0.4), 0 0 24px rgba(140, 160, 100, 0.25);
}
.fish-item.undead.rarity-rare {
    color: rgba(130, 180, 200, 0.85);
    border-color: rgba(100, 140, 160, 0.65);
    background: linear-gradient(135deg, rgba(60, 90, 110, 0.4) 0%, rgba(40, 60, 80, 0.2) 50%, rgba(60, 90, 110, 0.32) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 16px rgba(100,150,180,0.2);
}
.fish-item.undead.rarity-rare:hover {
    border-color: rgba(160, 210, 240, 0.95);
    background: linear-gradient(135deg, rgba(90, 130, 160, 0.55) 0%, rgba(60, 90, 110, 0.3) 50%, rgba(90, 130, 160, 0.42) 100%);
    box-shadow: 0 8px 28px rgba(110, 160, 190, 0.45), 0 0 30px rgba(110, 160, 190, 0.3);
}
.fish-item.undead.rarity-epic {
    color: rgba(160, 140, 190, 0.85);
    border-color: rgba(120, 100, 140, 0.7);
    background: linear-gradient(135deg, rgba(80, 60, 100, 0.4) 0%, rgba(50, 40, 70, 0.2) 50%, rgba(80, 60, 100, 0.32) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 18px rgba(140,110,170,0.22);
}
.fish-item.undead.rarity-epic:hover {
    border-color: rgba(200, 180, 230, 0.95);
    background: linear-gradient(135deg, rgba(120, 95, 150, 0.55) 0%, rgba(80, 65, 110, 0.3) 50%, rgba(120, 95, 150, 0.42) 100%);
    box-shadow: 0 8px 30px rgba(150, 120, 180, 0.45), 0 0 32px rgba(150, 120, 180, 0.3);
}
.fish-item.undead.rarity-legendary {
    color: rgba(200, 180, 120, 0.9);
    border-color: rgba(160, 140, 70, 0.8);
    background: linear-gradient(135deg, rgba(110, 90, 50, 0.42) 0%, rgba(70, 55, 30, 0.22) 50%, rgba(110, 90, 50, 0.34) 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 26px rgba(160,140,70,0.3);
    animation: undeadLegendaryPulse 3s ease-in-out infinite;
}
@keyframes undeadLegendaryPulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 26px rgba(160,140,70,0.3); }
    50% { box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 42px rgba(160,140,70,0.55); }
}
.fish-item.undead.rarity-legendary:hover {
    border-color: rgba(230, 210, 120, 1);
    background: linear-gradient(135deg, rgba(140, 120, 70, 0.58) 0%, rgba(95, 80, 45, 0.32) 50%, rgba(140, 120, 70, 0.45) 100%);
    box-shadow: 0 8px 40px rgba(170, 150, 80, 0.6), 0 0 50px rgba(170, 150, 80, 0.45);
}

.fish-icon {
    width: 56px; height: 56px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    flex-shrink: 0;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    transition: transform 0.3s;
}
.fish-item:hover .fish-icon { transform: scale(1.1); }

.fish-name {
    font-size: 0.95rem; font-weight: 700; flex: 1;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}
.fish-count {
    background: rgba(0,212,255,0.3); color: #ffffff;
    font-weight: 900; font-size: 0.95rem; padding: 5px 11px;
    border-radius: 9px; flex-shrink: 0;
    min-width: 40px; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 4px rgba(0,0,0,0.3);
}
.fish-item.rarity-common .fish-count { background: rgba(120,160,200,0.4); }
.fish-item.rarity-rare .fish-count { background: rgba(0,212,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 12px rgba(0,212,255,0.5); }
.fish-item.rarity-epic .fish-count { background: rgba(167,139,250,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 14px rgba(167,139,250,0.5); }
.fish-item.rarity-legendary .fish-count { background: rgba(255,215,0,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 16px rgba(255,215,0,0.6); color: #fff8d0; }
.fish-item.undead .fish-count { background: rgba(120,130,90,0.5); }
/* === МОДАЛЬНОЕ ОКНО (КАРТОЧКА РЫБЫ) === */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
    perspective: 1200px;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }

.fish-modal {
    background: 
        radial-gradient(ellipse at 30% 20%, rgba(80, 100, 130, 0.95) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(40, 60, 85, 0.98) 0%, transparent 60%),
        linear-gradient(135deg, rgba(35, 55, 80, 0.98) 0%, rgba(15, 28, 42, 0.99) 100%);
    border-radius: 28px;
    padding: 40px 32px 28px;
    max-width: 540px;
    width: 100%;
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.8),
        0 0 80px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    position: relative;
    transform: scale(0.85) translateY(30px) rotateX(8deg);
    transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
    transform-style: preserve-3d;
    isolation: isolate;
}
.modal-overlay.show .fish-modal { 
    transform: scale(1) translateY(0) rotateX(0deg);
}

/* === ВРАЩАЮЩИЕСЯ ВЕНЗЕЛЯ В УГЛАХ === */
.modal-corner {
    position: absolute;
    width: 60px;
    height: 60px;
    color: currentColor;
    opacity: 0.7;
    pointer-events: none;
    z-index: 6;
    transition: all 0.4s;
    filter: drop-shadow(0 0 8px currentColor);
}
.fish-modal:hover .modal-corner {
    opacity: 1;
    transform: scale(1.05);
    filter: drop-shadow(0 0 14px currentColor);
}
.modal-corner.tl { top: 12px; left: 12px; }
.modal-corner.tr { top: 12px; right: 12px; transform: scaleX(-1); }
.modal-corner.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
.modal-corner.br { bottom: 12px; right: 12px; transform: scale(-1, -1); }
.fish-modal:hover .modal-corner.tr { transform: scaleX(-1) scale(1.05); }
.fish-modal:hover .modal-corner.bl { transform: scaleY(-1) scale(1.05); }
.fish-modal:hover .modal-corner.br { transform: scale(-1, -1) scale(1.05); }

/* Внутренняя тонкая рамка */
.fish-modal::before {
    content: '';
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    pointer-events: none;
    z-index: 0;
}

/* === ВЕРХНЯЯ ДЕКОРАТИВНАЯ ЛИНИЯ С ЗАВИТКАМИ === */
.fish-modal::after {
    content: '❦ ═══ ❦ ═══ ❦';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    color: currentColor;
    opacity: 0.7;
    letter-spacing: 4px;
    z-index: 6;
    white-space: nowrap;
    text-shadow: 0 0 10px currentColor;
}

/* === РАМКА ПО РЕДКОСТИ === */
.fish-modal.rarity-common { 
    color: rgba(160, 200, 240, 0.9); 
    border-color: rgba(140, 180, 220, 0.6);
    box-shadow: 
        0 40px 100px rgba(0,0,0,0.8),
        0 0 60px rgba(140, 180, 220, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.fish-modal.rarity-rare { 
    color: #00d4ff; 
    border-color: rgba(0, 212, 255, 0.75);
    box-shadow: 
        0 40px 100px rgba(0,0,0,0.8),
        0 0 80px rgba(0,212,255,0.4),
        0 0 120px rgba(0,212,255,0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.fish-modal.rarity-epic { 
    color: #c4b5fd; 
    border-color: rgba(167, 139, 250, 0.8);
    box-shadow: 
        0 40px 100px rgba(0,0,0,0.8),
        0 0 80px rgba(167,139,250,0.45),
        0 0 120px rgba(167,139,250,0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    animation: epicAura 4s ease-in-out infinite;
}
@keyframes epicAura {
    0%, 100% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 80px rgba(167,139,250,0.45), 0 0 120px rgba(167,139,250,0.25), inset 0 1px 0 rgba(255,255,255,0.15); }
    50% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 100px rgba(167,139,250,0.6), 0 0 150px rgba(167,139,250,0.35), inset 0 1px 0 rgba(255,255,255,0.2); }
}
.fish-modal.rarity-legendary { 
    color: #ffd700; 
    border-color: rgba(255, 215, 0, 0.9);
    box-shadow: 
        0 40px 100px rgba(0,0,0,0.8),
        0 0 100px rgba(255,215,0,0.5),
        0 0 180px rgba(255,215,0,0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    animation: legendaryAura 3s ease-in-out infinite;
}
@keyframes legendaryAura {
    0%, 100% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 100px rgba(255,215,0,0.5), 0 0 180px rgba(255,215,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2); }
    50% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 140px rgba(255,215,0,0.75), 0 0 240px rgba(255,215,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25); }
}

/* Нежить */
.fish-modal.undead.rarity-common { 
    color: rgba(150, 170, 120, 0.9); 
    border-color: rgba(120, 140, 90, 0.7);

/* === ГОЛОГРАФИЧЕСКИЙ ПЕРЕЛИВ (для epic/legendary) === */
.fish-modal.rarity-epic .modal-holo,
.fish-modal.rarity-legendary .modal-holo {

/* === КОРОНА (для легендарных карточек) === */
.modal-crown {

@keyframes crownBob {

}

/* === КАМНИ ПО УГЛАМ (для epic/legendary) === */
.modal-gem {

@keyframes gemTwinkle {

.modal-gem.g1 { top: 40px; left: 20px; animation-delay: 0s; }

/* === ЧАСТИЦЫ === */

.modal-close {

}

.modal-count {

    'Лещ':        { min: 15, max: 60,  rarity: 'common' },
    'Голавль':    { min: 10, max: 60,  rarity: 'common' },
    'Язь':        { min: 10, max: 60,  rarity: 'common' },
    'Линь':       { min: 20, max: 50,  rarity: 'common' },
    'Судак':      { min: 10, max: 90,  rarity: 'rare' },
    'Голец':      { min: 20, max: 60,  rarity: 'common' },
    'Сиг':        { min: 20, max: 60,  rarity: 'rare' },
    'Хариус':     { min: 20, max: 50,  rarity: 'rare' },
    'Змееголов':  { min: 20, max: 100, rarity: 'rare' },
    'Налим':      { min: 20, max: 80,  rarity: 'rare' },
    'Минога':     { min: 15, max: 40,  rarity: 'epic' },
    'Толстолобик':{ min: 10, max: 100, rarity: 'epic' },
    'Белый амур': { min: 30, max: 120, rarity: 'epic' },
    'Угорь':      { min: 20, max: 150, rarity: 'epic' },
    'Чоп':        { min: 5,  max: 30,  rarity: 'common' },
    'Сазан':      { min: 20, max: 100, rarity: 'epic' },
    'Карась':     { min: 10, max: 40,  rarity: 'common' },
    'Краснопёрка':{ min: 5,  max: 35,  rarity: 'common' },
    'Пескарь':    { min: 5,  max: 15,  rarity: 'common' }
};

const RARITY_INFO = {
    common:    { label: 'Обычная',     color: '#8ab4d6', icon: '⚪' },
    rare:      { label: 'Редкая',      color: '#00d4ff', icon: '🔷' },
    epic:      { label: 'Эпическая',   color: '#a78bfa', icon: '💜' },
    legendary: { label: 'Легендарная', color: '#ffd700', icon: '⭐' }
};

const ALL_FISH = [
    "Щука", "Форель", "Толстолобик", "Судак", "Сом",
    "Пескарь", "Окунь", "Налим", "Лосось", "Линь",
    "Лещ", "Краснопёрка", "Карп", "Карась", "Ёрш",
    "Уклейка", "Сазан", "Осётр", "Хариус", "Минога",
    "Голец", "Белый амур", "Сиг", "Змееголов", "Угорь",
    "Чоп", "Пиранья", "Плотва", "Язь", "Голавль"
];

// ========================================================
// ВСПОМОГАТЕЛЬНЫЕ
// ========================================================
function getFishInfo(fishName) {
    const info = getFishForm(fishName);
    let data = null;
    for (const key in FISH_DATA) {
        if (key.toLowerCase().replace('ё', 'е') === info.baseName.toLowerCase().replace('ё', 'е')) {
            data = FISH_DATA[key];
            break;
        }
    }
    if (!data) data = FISH_DATA['Плотва'];

    return {
        isUndead: info.isUndead,
        baseName: info.baseName,
        min: data.min,
        max: data.max,
        rarity: (data.rarity || 'common').toLowerCase()
    };
}

    
// ========================================================
// ЗАГРУЗКА
// ========================================================

const DATA_URL = '/data.json';
// === СОСТОЯНИЕ КАРТОЧКИ ===
let currentModalFish = null;  // какая рыба открыта сейчас (или null)
// === ФУНКЦИЯ ЗАГРУЗКИ И ОТРИСОВКИ ===
function loadAndRender(silent) {
    fetch(DATA_URL + '?t=' + Date.now())
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        })
        .then(data => {
            // === Проверяем, изменились ли данные ===
            const newJson = JSON.stringify(data);
            if (silent && window._lastJson === newJson) {
                return; // ничего не поменялось — не перерисовываем
            }
            window._lastJson = newJson;

            // === Время обновления ===
            if (data._lastUpdate) {
                document.getElementById('updateTime').textContent = data._lastUpdate;
                document.getElementById('lastUpdate').style.display = 'block';
            }


            // === Глобальные данные для карточки ===
            if (data._personalRecords) window._personalRecords = data._personalRecords;
            if (data._lifetimeCatches) window._lifetimeCatches = data._lifetimeCatches;

            // === Игрок ===
            const playerKey = Object.keys(data).find(
                key => !key.startsWith('_') && key.toLowerCase() === playerName.toLowerCase()
            );

            if (!playerKey) {
                playerCard.innerHTML = `
                    <div class="error">
                        <p style="font-size: 1.1rem; margin-bottom: 8px;">Игрок не найден</p>
                        <p style="color: rgba(255,255,255,0.5);">@${playerName} ещё не ловил рыбу</p>
                    </div>
                `;
                return;
            }

            renderInventory(playerKey, data[playerKey]);

// === ЕСЛИ КАРТОЧКА ОТКРЫТА — ОБНОВЛЯЕМ ЕЁ ===
if (currentModalFish) {
    const fishData = data[playerKey];
    if (fishData && fishData[currentModalFish] !== undefined) {
        // Обновляем count и lifetimeCount внутри карточки
        refreshOpenModal(currentModalFish, fishData[currentModalFish]);
    }
}
        })
        .catch(err => {
            if (!silent) {
                console.error(err);
                playerCard.innerHTML = `
                    <div class="error">
                        <p style="font-size: 1.1rem; margin-bottom: 8px;">Не удалось загрузить данные</p>
                        <p style="color: rgba(255,255,255,0.5);">Попробуйте позже</p>
                        <p style="color: rgba(255,255,255,0.3); font-size: 0.75rem; margin-top: 8px;">${err.message}</p>
                    </div>
                `;
            }
        });
}

// === ЗАГРУЗКА ИГРОКА ===
const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get('player');
const playerCard = document.getElementById('playerCard');

if (!playerName) {
    playerCard.innerHTML = `
        <div class="error">
            <p style="font-size: 1.1rem; margin-bottom: 8px;">🎣 Укажите ник игрока в адресе</p>
            <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">
                Пример: <code style="background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px;">?player=ваш_ник</code>
            </p>
        </div>
    `;
} else {
    // Первая загрузка — с индикатором "Загрузка..."
    loadAndRender(false);

    // Автообновление каждые 15 секунд (silent = без индикатора)
    setInterval(() => loadAndRender(true), 5000);
}

function renderServerStats(stats) {
    const grid = document.getElementById('serverStatsGrid');
    const topPlayerName = capitalizeName(stats.topPlayer || '');
    grid.innerHTML = `
        <div class="server-stat">
            <div class="stat-icon">🐟</div>
            <div class="stat-value">${stats.totalFish}</div>
            <div class="stat-label">Рыб всего</div>
        </div>
        <div class="server-stat">
            <div class="stat-icon">👥</div>
            <div class="stat-value">${stats.totalPlayers}</div>
            <div class="stat-label">Рыбаков</div>
        </div>
        <div class="server-stat">
            <div class="stat-icon">🏆</div>
            <div class="stat-value" style="font-size: 0.95rem;">@${topPlayerName}</div>
            <div class="stat-label">Лидер (${stats.topPlayerCount})</div>
        </div>
        <div class="server-stat">
            <div class="stat-icon">💎</div>
            <div class="stat-value" style="font-size: 0.95rem;">${capitalizeName(stats.rarestFish || '—')}</div>
            <div class="stat-label">Самая редкая</div>
        </div>
    `;
    document.getElementById('serverStats').style.display = 'block';
}

function renderInventory(playerName, inventory) {
    let totalRegular = 0, totalUndead = 0;
    const regularFish = [], undeadFish = [];
    const regularSet = new Set(), undeadSet = new Set();

    for (const [fish, count] of Object.entries(inventory)) {
        if (count <= 0) continue;
        const isUndead = fish.toLowerCase().startsWith('нежить ');
        const baseFish = isUndead ? fish.substring(7).trim() : fish;

        if (isUndead) {
            totalUndead += count;
            undeadFish.push({ name: fish, displayName: baseFish.charAt(0).toUpperCase() + baseFish.slice(1), count });
            undeadSet.add(baseFish.toLowerCase().replace('ё', 'е'));
        } else {
            totalRegular += count;
            regularFish.push({ name: fish, displayName: fish, count });
            regularSet.add(baseFish.toLowerCase().replace('ё', 'е'));
        }
    }

    regularFish.sort((a, b) => a.displayName.localeCompare(b.displayName, 'ru'));
    undeadFish.sort((a, b) => a.displayName.localeCompare(b.displayName, 'ru'));

    const total = totalRegular + totalUndead;
    const firstLetter = playerName.charAt(0).toUpperCase();

    let regularCaught = 0, undeadCaught = 0;
    ALL_FISH.forEach(fish => {
        const normalized = fish.toLowerCase().replace('ё', 'е');
        if (regularSet.has(normalized)) regularCaught++;
        if (undeadSet.has(normalized)) undeadCaught++;
    });
    const totalTypes = ALL_FISH.length;
    const regularPercent = Math.round(regularCaught / totalTypes * 100);
    const undeadPercent = Math.round(undeadCaught / totalTypes * 100);

    let html = `
        <div class="player-header">
            <div class="player-avatar">${firstLetter}</div>
            <div class="player-info">
                <h2>@${playerName}</h2>
                <div class="player-stats">Всего поймано: <span>${total}</span> рыб</div>
            </div>
            <a href="https://twitch.tv/${playerName}" target="_blank" class="twitch-link">📺 Twitch</a>
        </div>

        <div class="collection-progress">
            <div class="progress-block">
                <div class="progress-header">
                    <span class="label">🐟 Обычные</span>
                    <span class="count">${regularCaught} / ${totalTypes}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${regularPercent}%"></div>
                </div>
            </div>
            <div class="progress-block undead">
                <div class="progress-header">
                    <span class="label">🧟 Нежить</span>
                    <span class="count">${undeadCaught} / ${totalTypes}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${undeadPercent}%"></div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-icon">🐟</div>
                <div class="stat-value">${totalRegular}</div>
                <div class="stat-label">Обычные</div>
            </div>
            <div class="stat-box undead">
                <div class="stat-icon">🧟</div>
                <div class="stat-value">${totalUndead}</div>
                <div class="stat-label">Нежить</div>
            </div>
        </div>
    `;

    if (regularFish.length > 0) {
        html += `
            <div class="fish-section">
                <h3>🐟 Обычные рыбы</h3>
                <div class="fish-grid">
                    ${regularFish.map(fish => {
                        const info = getFishInfo(fish.name);
                        return `
                            <div class="fish-item rarity-${info.rarity}" data-fish="${fish.name}">
                                <div class="fish-item-inner"></div>
                                <img src="${getFishIcon(fish.name)}" alt="${fish.displayName}" class="fish-icon">
                                <span class="fish-name" ${fish.displayName.length > 10 ? 'data-long="true"' : ''}>${fish.displayName}</span>
                                <span class="fish-count">×${fish.count}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }

    if (undeadFish.length > 0) {
        html += `
            <div class="fish-section undead-section" style="margin-top: 14px;">
                <h3>🧟 Нежить</h3>
                <div class="fish-grid">
                    ${undeadFish.map(fish => {
                        const info = getFishInfo(fish.name);
                        return `
                            <div class="fish-item undead rarity-${info.rarity}" data-fish="${fish.name}">
                                <div class="fish-item-inner"></div>
                                <img src="${getFishIcon(fish.name)}" alt="${fish.displayName}" class="fish-icon">
                                <span class="fish-name">${fish.displayName}</span>
                                <span class="fish-count">×${fish.count}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }

    if (regularFish.length === 0 && undeadFish.length === 0) {
        html += `<div class="error" style="color: rgba(255,255,255,0.5);"><p>🎣 Инвентарь пуст</p></div>`;
    }

    playerCard.innerHTML = html;

    document.querySelectorAll('.fish-item').forEach(item => {
        item.addEventListener('click', function(e) {
            e.stopPropagation();
            const fishName = this.getAttribute('data-fish');
            const count = parseInt(this.querySelector('.fish-count').textContent.replace('×', ''), 10);
            showFishModal(fishName, count);
        });
    });
}

// ========================================================
// МОДАЛЬНАЯ КАРТОЧКА
// ========================================================

function showFishModal(fishName, count) {
    currentModalFish = fishName;
    const info = getFishInfo(fishName);
    const rarity = RARITY_INFO[info.rarity];
// Счётчик поймано за всё время
let lifetimeCount = count; // fallback
if (window._lifetimeCatches && window._lifetimeCatches[playerName.toLowerCase()]) {
    const playerLT = window._lifetimeCatches[playerName.toLowerCase()];
    const fishKey = fishName.toLowerCase();
    if (playerLT[fishKey] !== undefined) {
        lifetimeCount = playerLT[fishKey];
    }
}
    const recordKey = (playerName.toLowerCase() + '|' + fishName.toLowerCase());
    let recordHtml = '';
    if (window._personalRecords && window._personalRecords[recordKey]) {
        recordHtml = `<div class="info-value record">${window._personalRecords[recordKey]} см</div>`;
    } else {
        recordHtml = `<div class="info-value no-record">не установлен</div>`;
    }

    const baseCapitalized = info.baseName.charAt(0).toUpperCase() + info.baseName.slice(1);
const displayName = info.isUndead ? '🧟 ' + baseCapitalized : baseCapitalized;
    const bigIcon = getFishIcon(fishName, 5);

    // Вензеля в углах
    const cornerSVG = `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M 5 5 Q 5 20 15 20 Q 28 20 28 10 Q 28 5 18 5 Q 12 5 12 12"/>
        <path d="M 10 10 Q 10 18 20 18"/>
        <circle cx="15" cy="15" r="2" fill="currentColor" stroke="none"/>
        <path d="M 5 5 L 10 10" stroke-opacity="0.5"/>
    </svg>`;

    // Частицы для epic/legendary
    let particlesHtml = '';
    if (info.rarity === 'legendary' || info.rarity === 'epic') {
        particlesHtml = '<div class="modal-particles">';
        for (let i = 0; i < 12; i++) {
            const left = 5 + Math.random() * 90;
            const top = 20 + Math.random() * 70;
            const delay = Math.random() * 4;
            const duration = 3 + Math.random() * 2;
            particlesHtml += `<div class="particle" style="left: ${left}%; top: ${top}%; animation-delay: ${delay}s; animation-duration: ${duration}s;"></div>`;
        }
        particlesHtml += '</div>';
    }

    // Голограмма
    let holoHtml = '';
    if (info.rarity === 'legendary' || info.rarity === 'epic') {
        holoHtml = '<div class="modal-holo"></div>';
    }

    // Корона для легендарных
    let crownHtml = '';
    if (info.rarity === 'legendary') {
        crownHtml = `<div class="modal-crown">${info.isUndead ? '💀' : '👑'}</div>`;
    }

    // Камни для epic/legendary
    let gemsHtml = '';
    if (info.rarity === 'legendary' || info.rarity === 'epic') {
        const gemChar = info.isUndead ? '💠' : '💎';
        gemsHtml = `
            <div class="modal-gem g1">${gemChar}</div>
            <div class="modal-gem g2">${gemChar}</div>
            <div class="modal-gem g3">${gemChar}</div>
            <div class="modal-gem g4">${gemChar}</div>
        `;
    }

    const modal = document.getElementById('fishModalContent');
    modal.className = 'fish-modal rarity-' + info.rarity + (info.isUndead ? ' undead' : '');
    modal.innerHTML = `
    <div class="modal-corner tl">${cornerSVG}</div>
    <div class="modal-corner tr">${cornerSVG}</div>
    <div class="modal-corner bl">${cornerSVG}</div>
    <div class="modal-corner br">${cornerSVG}</div>
    ${holoHtml}
    ${crownHtml}
    ${gemsHtml}
    ${particlesHtml}
    <button class="modal-close" onclick="closeFishModal()">✕</button>
    <div class="modal-fish-icon-wrap">
        <img src="${bigIcon}" alt="${info.baseName}" class="modal-fish-icon">
    </div>
    <div class="modal-fish-name ${info.isUndead ? 'undead' : ''}">${displayName}</div>
    <div class="modal-rarity rarity-${info.rarity}">${rarity.icon} ${rarity.label.toUpperCase()}</div>
    <div class="modal-info-grid">
        <div class="modal-info-block">
            <div class="info-label">Размер</div>
            <div class="info-value">${info.min}–${info.max} см</div>
        </div>
        <div class="modal-info-block">
            <div class="info-label">Твой рекорд</div>
            ${recordHtml}
        </div>
    </div>
    <div class="modal-counts ${info.isUndead ? 'undead' : ''}">
    <div class="modal-count-item">
        <div class="count-label">📦 В инвентаре</div>
        <div class="count-value">${count}</div>
    </div>
    <div class="modal-count-item lifetime">
        <div class="count-label">🏆 Поймано за всё время</div>
        <div class="count-value">${lifetimeCount}</div>
    </div>
</div>
`;
    document.getElementById('fishModal').classList.add('show');
}
    
function closeFishModal() {
    document.getElementById('fishModal').classList.remove('show');
    currentModalFish = null;  // ← сбрасываем
}
// === ОБНОВЛЕНИЕ ОТКРЫТОЙ КАРТОЧКИ БЕЗ ЗАКРЫТИЯ ===
function refreshOpenModal(fishName, count) {
    const info = getFishInfo(fishName);
    const modal = document.getElementById('fishModalContent');
    if (!modal) return;

    // === СЧИТАЕМ LIFETIME ===
    let lifetimeCount = count;
    if (window._lifetimeCatches && window._lifetimeCatches[playerName.toLowerCase()]) {
        const playerLT = window._lifetimeCatches[playerName.toLowerCase()];
        const fishKey = fishName.toLowerCase();
        if (playerLT[fishKey] !== undefined) {
            lifetimeCount = playerLT[fishKey];
        }
    }

    // === ФУНКЦИЯ ОБНОВЛЕНИЯ ЗНАЧЕНИЯ С ПОДСВЕТКОЙ ===
    function setCountValue(el, newValue) {
        if (!el) return;
        const current = el.textContent.trim();
        if (current !== String(newValue)) {
            el.textContent = newValue;
            // Перезапуск CSS-анимации
            el.classList.remove('updated');
            void el.offsetWidth; // reflow — обязательно для перезапуска анимации
            el.classList.add('updated');
            setTimeout(() => el.classList.remove('updated'), 1000);
        }
    }

    // === ОБНОВЛЯЕМ СЧЁТЧИКИ ===
    const countItems = modal.querySelectorAll('.modal-count-item .count-value');
    if (countItems.length >= 1) {
        setCountValue(countItems[0], count);
    }
    if (countItems.length >= 2) {
        setCountValue(countItems[1], lifetimeCount);
    }

    // === ОБНОВЛЯЕМ ЛИЧНЫЙ РЕКОРД ===
    const recordBlock = modal.querySelector('.modal-info-block:last-child');
    if (recordBlock) {
        const recordValueEl = recordBlock.querySelector('.info-value');
        if (recordValueEl) {
            const recordKey = (playerName.toLowerCase() + '|' + fishName.toLowerCase());
            if (window._personalRecords && window._personalRecords[recordKey]) {
                const newRecord = window._personalRecords[recordKey] + ' см';
                if (recordValueEl.textContent.trim() !== newRecord) {
                    recordValueEl.className = 'info-value record';
                    recordValueEl.textContent = newRecord;
                    // Подсветка рекорда
                    recordValueEl.classList.remove('updated');
                    void recordValueEl.offsetWidth;
                    recordValueEl.classList.add('updated');
                    setTimeout(() => recordValueEl.classList.remove('updated'), 1000);
                }
            } else {
                if (recordValueEl.textContent.trim() !== 'не установлен') {
                    recordValueEl.className = 'info-value no-record';
                    recordValueEl.textContent = 'не установлен';
                }
            }
        }
    }
}
document.getElementById('fishModal').addEventListener('click', function(e) {
    if (e.target === this) closeFishModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeFishModal();
});
</script>
