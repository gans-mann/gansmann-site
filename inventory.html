<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инвентарь рыбака — gans_mann</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-main: #0c1822;
    --bg-card: rgba(18, 32, 45, 0.75);
    --border-card: rgba(0, 212, 255, 0.16);
    --accent-cyan: #00d4ff;
    --accent-green: #00ffa3;
    --accent-gold: #ffd700;
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --text-muted: rgba(255, 255, 255, 0.45);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--bg-main);
    background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(0, 212, 255, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 255, 163, 0.06) 0%, transparent 50%),
        linear-gradient(180deg, #09131b 0%, #0c1822 40%, #0e1e2b 100%);
    background-attachment: fixed;
    min-height: 100vh; color: var(--text-primary);
    padding: 12px 14px 40px; display: flex; justify-content: center;
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
}

.container { width: 100%; max-width: 1300px; position: relative; z-index: 1; }

.header { text-align: center; margin-bottom: 20px; }
.header h1 {
    font-size: 2.1rem; font-weight: 900;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 4px; letter-spacing: -1px;
}
.header .subtitle { font-size: 0.9rem; color: var(--text-muted); }
.header .subtitle a { color: var(--accent-cyan); text-decoration: none; }

/* Карточка игрока */
.player-card {
    background: var(--bg-card); 
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-card); 
    border-radius: 20px; 
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
}

/* Шапка игрока */
.player-header {
    display: flex; align-items: center; gap: 16px; 
    margin-bottom: 16px; padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    flex-wrap: wrap;
}
.player-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-green) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 900; color: #0c1822;
    box-shadow: 0 0 24px rgba(0, 212, 255, 0.45); flex-shrink: 0;
    border: 3px solid rgba(255, 255, 255, 0.35);
}
.player-info { flex: 1; min-width: 140px; }
.player-info h2 { font-size: 1.35rem; font-weight: 900; margin-bottom: 4px; letter-spacing: -0.5px; }
.player-info .player-stats { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
.player-info .player-stats span { color: var(--accent-green); font-weight: 800; }

.twitch-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
    background: linear-gradient(135deg, #9146ff, #6441a5); color: white;
    text-decoration: none; border-radius: 10px; font-size: 0.8rem; font-weight: 700;
    transition: all 0.25s; border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 4px 14px rgba(145, 70, 255, 0.35);
}
.twitch-link:hover { background: linear-gradient(135deg, #a15aff, #734bc2); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(145, 70, 255, 0.55); }

/* Прогресс-бары */
.collection-progress { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.progress-block { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; }
.progress-block.undead { background: rgba(120,90,60,0.08); border-color: rgba(120,90,60,0.3); }
.progress-block.halloween { background: rgba(255,100,0,0.1); border-color: rgba(255,100,0,0.4); }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; font-weight: 600; }
.progress-header .label { color: var(--text-secondary); }
.progress-header .count { color: var(--accent-cyan); font-weight: 700; }
.progress-block.undead .progress-header .count { color: #a8b878; }
.progress-block.halloween .progress-header .count { color: #ff8c00; }
.progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green)); border-radius: 3px; transition: width 0.8s ease; }
.progress-block.undead .progress-fill { background: linear-gradient(90deg, #6a7a4a, #a8b878); }
.progress-block.halloween .progress-fill { background: linear-gradient(90deg, #ff8c00, #ffd700); }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; text-align: center; }
.stat-box .stat-icon { font-size: 1.2rem; margin-bottom: 3px; }
.stat-box .stat-value { font-size: 1.3rem; font-weight: 900; color: var(--accent-cyan); line-height: 1; margin-bottom: 3px; }
.stat-box .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.stat-box.undead .stat-value { color: #a8b878; }

/* Единая кнопка аквариума */
.aquarium-single-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.25) 0%, rgba(0, 255, 163, 0.15) 100%);
    border: 2px solid rgba(0, 212, 255, 0.5); color: #fff;
    font-size: 1rem; font-weight: 800; text-decoration: none;
    margin-bottom: 16px; transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
}
.aquarium-single-btn:hover { transform: translateY(-2px); border-color: rgba(0, 212, 255, 0.9); box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4); }

/* Фильтры и поиск */
.filter-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: rgba(14, 26, 38, 0.6); border: 1px solid var(--border-card);
    border-radius: 14px; padding: 8px 12px; margin-bottom: 16px;
}
.filter-btn {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary); padding: 8px 14px; border-radius: 10px;
    font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
}
.filter-btn:hover, .filter-btn.active { background: rgba(0, 212, 255, 0.18); border-color: var(--accent-cyan); color: #fff; }
.filter-search-input {
    flex: 1; min-width: 160px; background: rgba(10, 20, 28, 0.7);
    border: 1px solid var(--border-card); border-radius: 8px;
    padding: 8px 12px; color: #fff; font-family: inherit; font-size: 0.82rem; outline: none;
}
.filter-search-input:focus { border-color: var(--accent-cyan); }

/* Секции */
.fish-section h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.fish-section h3::before { content: ''; width: 3px; height: 14px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green)); border-radius: 2px; }
.fish-section.undead-section h3::before { background: linear-gradient(135deg, #6a7a4a, #a8b878); }
.fish-section.halloween-section h3::before { background: linear-gradient(135deg, #ff8c00, #ffd700); }
.fish-section.boss-section h3::before { background: linear-gradient(135deg, #ff0000, #800000); }

.fish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; padding: 8px 6px 12px; margin-top: -8px; }

/* Плашки рыб */
.fish-item {
    border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer; position: relative; user-select: none; border: 1.5px solid transparent;
    transform: translateZ(0); contain: layout style;
}
.fish-item .fish-item-inner {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0;
    will-change: opacity; transform: translateZ(0); border-radius: 12px; transition: opacity 0.3s ease;
}
.fish-item > * { position: relative; z-index: 1; }

.fish-item:not(.not-caught).rarity-common { color: rgba(160, 200, 240, 0.9); border-color: rgba(120, 170, 220, 0.4); background: linear-gradient(145deg, rgba(30, 50, 75, 0.45) 0%, rgba(14, 26, 40, 0.7) 100%); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
.fish-item:not(.not-caught).rarity-common:hover { border-color: rgba(160, 215, 255, 0.85); background: linear-gradient(145deg, rgba(45, 75, 110, 0.6) 0%, rgba(18, 34, 52, 0.8) 100%); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 20px rgba(120, 180, 240, 0.25); }
.fish-item:not(.not-caught).rarity-rare { color: rgba(140, 235, 255, 0.95); border-color: rgba(0, 212, 255, 0.5); background: linear-gradient(145deg, rgba(0, 100, 150, 0.35) 0%, rgba(10, 28, 44, 0.7) 100%); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(0, 212, 255, 0.2), 0 0 14px rgba(0, 212, 255, 0.12); }
.fish-item:not(.not-caught).rarity-rare:hover { border-color: rgba(80, 240, 255, 0.95); background: linear-gradient(145deg, rgba(0, 140, 200, 0.5) 0%, rgba(14, 38, 60, 0.8) 100%); transform: translateY(-3px); box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35), 0 0 26px rgba(0, 212, 255, 0.4); }
.fish-item:not(.not-caught).rarity-epic { color: rgba(220, 195, 255, 0.95); border-color: rgba(167, 139, 250, 0.6); background: linear-gradient(145deg, rgba(100, 60, 160, 0.35) 0%, rgba(16, 18, 38, 0.7) 100%); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(190, 160, 255, 0.2), 0 0 16px rgba(167, 139, 250, 0.15); }
.fish-item:not(.not-caught).rarity-epic:hover { border-color: rgba(215, 190, 255, 1); background: linear-gradient(145deg, rgba(130, 85, 210, 0.5) 0%, rgba(24, 22, 52, 0.8) 100%); transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 0 28px rgba(167, 139, 250, 0.4); }
.fish-item:not(.not-caught).rarity-legendary { color: rgba(255, 235, 150, 0.95); border-color: rgba(255, 215, 0, 0.75); background: linear-gradient(145deg, rgba(160, 110, 10, 0.35) 0%, rgba(26, 22, 18, 0.7) 100%); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 235, 120, 0.25), 0 0 18px rgba(255, 215, 0, 0.2); }
.fish-item:not(.not-caught).rarity-legendary .fish-item-inner { box-shadow: 0 0 32px rgba(255, 215, 0, 0.6); opacity: 0.4; animation: gpuAuraPulse 3s ease-in-out infinite; }
.fish-item:not(.not-caught).rarity-legendary:hover { border-color: rgba(255, 245, 150, 1); background: linear-gradient(145deg, rgba(200, 140, 15, 0.5) 0%, rgba(36, 28, 20, 0.8) 100%); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 34px rgba(255, 215, 0, 0.5); }
.fish-item:not(.not-caught).rarity-legendary:hover .fish-item-inner { opacity: 1; box-shadow: 0 0 45px rgba(255, 215, 0, 0.85); }
@keyframes gpuAuraPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

.fish-item:not(.not-caught).undead.rarity-common { color: rgba(150, 170, 120, 0.8); border-color: rgba(120, 130, 90, 0.55); background: linear-gradient(135deg, rgba(70, 80, 60, 0.4) 0%, rgba(40, 50, 35, 0.2) 100%); }
.fish-item:not(.not-caught).undead.rarity-common:hover { border-color: rgba(180, 200, 140, 0.9); background: linear-gradient(135deg, rgba(100, 120, 80, 0.55) 0%, rgba(60, 75, 50, 0.3) 100%); box-shadow: 0 8px 24px rgba(140, 160, 100, 0.4); }
.fish-item:not(.not-caught).undead.rarity-rare { color: rgba(130, 180, 200, 0.85); border-color: rgba(100, 140, 160, 0.65); background: linear-gradient(135deg, rgba(60, 90, 110, 0.4) 0%, rgba(40, 60, 80, 0.2) 100%); }
.fish-item:not(.not-caught).undead.rarity-rare:hover { border-color: rgba(160, 210, 240, 0.95); background: linear-gradient(135deg, rgba(90, 130, 160, 0.55) 0%, rgba(60, 90, 110, 0.3) 100%); box-shadow: 0 8px 28px rgba(110, 160, 190, 0.45); }
.fish-item:not(.not-caught).undead.rarity-epic { color: rgba(160, 140, 190, 0.85); border-color: rgba(120, 100, 140, 0.7); background: linear-gradient(135deg, rgba(80, 60, 100, 0.4) 0%, rgba(50, 40, 70, 0.2) 100%); }
.fish-item:not(.not-caught).undead.rarity-epic:hover { border-color: rgba(200, 180, 230, 0.95); background: linear-gradient(135deg, rgba(120, 95, 150, 0.55) 0%, rgba(80, 65, 110, 0.3) 100%); box-shadow: 0 8px 30px rgba(150, 120, 180, 0.45); }
.fish-item:not(.not-caught).undead.rarity-legendary { color: rgba(200, 180, 120, 0.9); border-color: rgba(160, 140, 70, 0.8); background: linear-gradient(135deg, rgba(110, 90, 50, 0.42) 0%, rgba(70, 55, 30, 0.22) 100%); }
.fish-item:not(.not-caught).undead.rarity-legendary .fish-item-inner { box-shadow: 0 0 32px rgba(160, 140, 70, 0.65); opacity: 0.4; animation: gpuAuraPulse 3s ease-in-out infinite; }
.fish-item:not(.not-caught).undead.rarity-legendary:hover { border-color: rgba(230, 210, 120, 1); background: linear-gradient(135deg, rgba(140, 120, 70, 0.58) 0%, rgba(95, 80, 45, 0.32) 100%); }
.fish-item:not(.not-caught).undead.rarity-legendary:hover .fish-item-inner { opacity: 1; box-shadow: 0 0 42px rgba(180, 160, 80, 0.8); }

.fish-item:not(.not-caught).halloween.rarity-common { color: rgba(255, 165, 0, 0.9); border-color: rgba(255, 140, 0, 0.6); background: linear-gradient(135deg, rgba(255, 140, 0, 0.25) 0%, rgba(139, 69, 19, 0.15) 100%); }
.fish-item:not(.not-caught).halloween.rarity-rare { color: #ff8c00; border-color: rgba(255, 165, 0, 0.8); background: linear-gradient(135deg, rgba(255, 140, 0, 0.35) 0%, rgba(255, 69, 0, 0.2) 100%); }
.fish-item:not(.not-caught).halloween.rarity-epic { color: #ba55d3; border-color: rgba(186, 85, 211, 0.8); background: linear-gradient(135deg, rgba(186, 85, 211, 0.3) 0%, rgba(75, 0, 130, 0.2) 100%); }
.fish-item:not(.not-caught).halloween.rarity-legendary { color: #ffd700; border-color: rgba(255, 140, 0, 0.9); background: linear-gradient(135deg, rgba(255, 140, 0, 0.4) 0%, rgba(139, 0, 0, 0.3) 100%); }

/* Босс */
.fish-item.boss { padding: 20px; justify-content: flex-start; }
.fish-item.boss .boss-icon-wrap { width: 100px; height: 100px; flex-shrink: 0; margin-right: 15px; background: radial-gradient(circle, rgba(255, 0, 0, 0.3) 0%, rgba(20, 0, 0, 0.7) 80%); border-radius: 18px; border: 1px solid rgba(255, 50, 50, 0.5); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6); }
.fish-item.boss .fish-name { font-size: 1.4rem; font-weight: 900; text-align: left; }
.fish-item.boss .fish-count { position: absolute; bottom: 15px; right: 15px; font-size: 1.2rem; padding: 8px 15px; border-radius: 9px; }
.fish-item:not(.not-caught).boss { color: #ff0000; border: 2px solid #ff0000; background: radial-gradient(circle at center, rgba(255, 0, 0, 0.2) 0%, rgba(20, 0, 0, 0.8) 100%); box-shadow: 0 0 16px rgba(255, 0, 0, 0.4); }
.fish-item:not(.not-caught).boss .fish-item-inner { box-shadow: 0 0 36px rgba(255, 0, 0, 0.75); opacity: 0.45; animation: gpuAuraPulse 2s ease-in-out infinite; }
.fish-item:not(.not-caught).boss:hover { transform: translateY(-3px); }
.fish-item:not(.not-caught).boss:hover .fish-item-inner { opacity: 1; box-shadow: 0 0 52px rgba(255, 0, 0, 0.95); }
.fish-item:not(.not-caught).boss .fish-name { color: #ff5555; text-shadow: 0 0 10px red; }
.fish-item:not(.not-caught).boss .fish-count { background: #ff0000; color: white; box-shadow: 0 0 10px red; }

/* Неактивные */
.fish-item.not-caught { color: rgba(255, 255, 255, 0.35); border-color: rgba(255, 255, 255, 0.1); background: rgba(14, 24, 34, 0.45); box-shadow: none; filter: grayscale(0.85); opacity: 0.55; border-style: dashed; }
.fish-item.not-caught:hover { opacity: 0.85; filter: grayscale(0.3); border-color: rgba(0, 212, 255, 0.4); transform: translateY(-2px); }
.fish-item.not-caught .fish-icon { opacity: 0.4; }
.fish-item.not-caught .fish-count { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.45); border-color: rgba(255, 255, 255, 0.1); box-shadow: none; }

.fish-icon { width: 56px; height: 56px; image-rendering: pixelated; image-rendering: crisp-edges; object-fit: contain; flex-shrink: 0; transition: transform 0.25s ease, filter 0.25s ease; filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.45)); }
.fish-item:hover .fish-icon { transform: scale(1.14); filter: drop-shadow(0 4px 10px rgba(0, 212, 255, 0.4)); }
.fish-name { font-size: 0.95rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: normal; word-break: break-word; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.fish-item.not-caught .fish-name { text-shadow: none; }
.fish-count { background: rgba(0,212,255,0.3); color: #ffffff; font-weight: 900; font-size: 0.95rem; padding: 5px 11px; border-radius: 9px; flex-shrink: 0; min-width: 40px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 4px rgba(0,0,0,0.3); }
.fish-item:not(.not-caught).rarity-common .fish-count { background: rgba(120,160,200,0.4); }
.fish-item:not(.not-caught).rarity-rare .fish-count { background: rgba(0,212,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 12px rgba(0,212,255,0.5); }
.fish-item:not(.not-caught).rarity-epic .fish-count { background: rgba(167,139,250,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 14px rgba(167,139,250,0.5); }
.fish-item:not(.not-caught).rarity-legendary .fish-count { background: rgba(255,215,0,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 16px rgba(255,215,0,0.6); color: #fff8d0; }
.fish-item:not(.not-caught).undead .fish-count { background: rgba(120,130,90,0.5); }

/* Модалка */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; perspective: 1200px; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.fish-modal { background: radial-gradient(ellipse at 30% 20%, rgba(80, 100, 130, 0.95) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(40, 60, 85, 0.98) 0%, transparent 60%), linear-gradient(135deg, rgba(35, 55, 80, 0.98) 0%, rgba(15, 28, 42, 0.99) 100%); border-radius: 28px; padding: 40px 32px 28px; max-width: 540px; width: 100%; border: 2px solid rgba(255, 255, 255, 0.15); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15); position: relative; transform: scale(0.85) translateY(30px) rotateX(8deg); transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); overflow: hidden; transform-style: preserve-3d; isolation: isolate; }
.modal-overlay.show .fish-modal { transform: scale(1) translateY(0) rotateX(0deg); }
.fish-modal.boss-modal { max-width: 600px; border-color: #ff0000; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 100px rgba(255, 0, 0, 0.5), inset 0 1px 0 rgba(255, 100, 100, 0.2); background: radial-gradient(circle at center, rgba(80, 0, 0, 0.95) 0%, rgba(10, 0, 0, 0.98) 100%); }
.fish-modal.boss-modal .modal-fish-icon { width: 250px; height: 250px; object-fit: contain; filter: brightness(1.7) contrast(1.35) saturate(1.4) drop-shadow(0 0 20px rgba(255, 0, 0, 0.9)) drop-shadow(0 0 40px rgba(255, 50, 50, 0.6)); }
.fish-modal.boss-modal .modal-fish-name { font-size: 2.5rem; background: none; -webkit-text-fill-color: #ff2222; color: #ff2222; text-shadow: 0 0 30px red, 0 0 60px rgba(255,0,0,0.6); }
.fish-modal.boss-modal .modal-rarity { color: #ff0000; font-size: 1.2rem; letter-spacing: 10px; }
.fish-modal.boss-modal .modal-info-block .info-value { color: #ff5555; }

/* === ИСПРАВЛЕННЫЕ ВЕНЗЕЛЯ === */
.modal-corner { 
    position: absolute; width: 60px; height: 60px; color: currentColor; 
    opacity: 0.7; pointer-events: none; z-index: 6; 
    transition: opacity 0.4s, filter 0.4s; 
    /* Отключаем любые перевороты и масштабирование */
    transform: none !important; 
}
.modal-corner.tl { top: 12px; left: 12px; }
.modal-corner.tr { top: 12px; right: 12px; }
.modal-corner.bl { bottom: 12px; left: 12px; }
.modal-corner.br { bottom: 12px; right: 12px; }

.fish-modal:hover .modal-corner { 
    opacity: 1; 
    filter: brightness(1.5) drop-shadow(0 0 10px currentColor); 
    /* Никакого масштаба, только свечение */
    transform: none !important; 
}

.fish-modal::before { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); pointer-events: none; z-index: 0; }
.fish-modal::after { content: '❦ ═══ ❦ ═══ ❦'; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 0.9rem; color: currentColor; opacity: 0.7; letter-spacing: 4px; z-index: 6; white-space: nowrap; text-shadow: 0 0 10px currentColor; }
.fish-modal.rarity-common { color: rgba(160, 200, 240, 0.9); border-color: rgba(140, 180, 220, 0.6); }
.fish-modal.rarity-rare { color: #00d4ff; border-color: rgba(0, 212, 255, 0.75); }
.fish-modal.rarity-epic { color: #c4b5fd; border-color: rgba(167, 139, 250, 0.8); animation: epicAura 4s ease-in-out infinite; }
.fish-modal.rarity-legendary { color: #ffd700; border-color: rgba(255, 215, 0, 0.9); animation: legendaryAura 3s ease-in-out infinite; }
@keyframes epicAura { 0%, 100% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 80px rgba(167,139,250,0.45); } 50% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 100px rgba(167,139,250,0.6); } }
@keyframes legendaryAura { 0%, 100% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 100px rgba(255,215,0,0.5); } 50% { box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 140px rgba(255,215,0,0.75); } }
.fish-modal.undead.rarity-common { color: rgba(150, 170, 120, 0.9); border-color: rgba(120, 140, 90, 0.7); }
.fish-modal.undead.rarity-rare { color: #8ab4c8; border-color: rgba(100, 140, 160, 0.75); }
.fish-modal.undead.rarity-epic { color: #a890c8; border-color: rgba(130, 100, 150, 0.8); }
.fish-modal.undead.rarity-legendary { color: #c8b078; border-color: rgba(200, 170, 80, 0.9); }
.modal-crown { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 42px; filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.8)); z-index: 10; animation: crownBob 3s ease-in-out infinite; pointer-events: none; }
@keyframes crownBob { 0%, 100% { transform: translateX(-50%) translateY(0) rotate(-3deg); } 50% { transform: translateX(-50%) translateY(-6px) rotate(3deg); } }
.modal-close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s; z-index: 20; backdrop-filter: blur(6px); }
.modal-close:hover { background: rgba(255, 80, 80, 0.6); transform: rotate(90deg) scale(1.15); }
.modal-fish-icon-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; padding: 30px 20px 20px; position: relative; z-index: 2; }
.modal-fish-icon-wrap::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, currentColor 0%, transparent 60%); opacity: 0.25; animation: haloPulse 3s ease-in-out infinite; z-index: -1; }
@keyframes haloPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.25; } 50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.4; } }
.modal-fish-icon { width: 190px; height: 190px; image-rendering: pixelated; image-rendering: crisp-edges; animation: fishSwim 3s ease-in-out infinite; position: relative; z-index: 2; }
@keyframes fishSwim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.fish-modal .modal-fish-icon-wrap, .fish-modal .modal-fish-name, .fish-modal .modal-info-grid, .fish-modal .modal-counts { opacity: 0; transform: translateY(15px); animation: fadeInUp 0.5s ease forwards; }
.fish-modal .modal-fish-icon-wrap { animation-delay: 0.15s; } .fish-modal .modal-fish-name { animation-delay: 0.25s; } .fish-modal .modal-info-grid { animation-delay: 0.45s; } .fish-modal .modal-counts { animation-delay: 0.55s; }
@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
.modal-fish-name { text-align: center; font-size: 1.7rem; font-weight: 900; margin-bottom: 8px; background: linear-gradient(135deg, #00d4ff, #00ffa3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; position: relative; z-index: 2; letter-spacing: 1.5px; }
.modal-fish-name.undead { background: linear-gradient(135deg, #8a9a6a, #c8b878); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.modal-fish-name::before, .modal-fish-name::after { content: '❦'; font-size: 1.2rem; color: currentColor; opacity: 0.8; position: absolute; top: 50%; transform: translateY(-50%); -webkit-text-fill-color: currentColor; }
.modal-fish-name::before { left: 8%; } .modal-fish-name::after { right: 8%; }
.modal-rarity { text-align: center; font-size: 0.95rem; font-weight: 800; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 5px; position: relative; z-index: 2; padding: 0 40px; }
.modal-rarity.rarity-common { color: #8ab4d6; } .modal-rarity.rarity-rare { color: #00d4ff; } .modal-rarity.rarity-epic { color: #c4b5fd; } .modal-rarity.rarity-legendary { color: #ffd700; font-size: 1.05rem; letter-spacing: 7px; animation: legendaryGlow 2s ease-in-out infinite; } .modal-rarity.rarity-boss { color: #ff0000; font-size: 1.2rem; letter-spacing: 10px; animation: bossGlow 2s ease-in-out infinite; }
@keyframes legendaryGlow { 0%, 100% { text-shadow: 0 0 22px rgba(255,215,0,0.8); } 50% { text-shadow: 0 0 32px rgba(255,215,0,1); } } @keyframes bossGlow { 0%, 100% { text-shadow: 0 0 22px rgba(255,0,0,0.8); } 50% { text-shadow: 0 0 40px rgba(255,0,0,1); } }
.modal-rarity::after { content: ''; display: block; width: 60%; height: 1px; margin: 10px auto 0; background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%); opacity: 0.6; }
.modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; position: relative; z-index: 2; }
.modal-info-block { background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 18px 14px; text-align: center; position: relative; overflow: hidden; }
.modal-info-block .info-label { font-size: 0.7rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 2.5px; font-weight: 700; margin-bottom: 10px; }
.modal-info-block .info-value { font-size: 1.35rem; font-weight: 900; color: #00d4ff; }
.modal-info-block .info-value.record { color: #ffd700; }
.modal-info-block .info-value.no-record { color: rgba(255,255,255,0.35); font-size: 0.9rem; font-weight: 600; }
.modal-counts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 2; }
.modal-count-item { text-align: center; padding: 14px 10px; background: linear-gradient(135deg, rgba(0,212,255,0.18) 0%, rgba(0,212,255,0.05) 100%); border: 1px solid rgba(0,212,255,0.4); border-radius: 14px; }
.modal-count-item .count-label { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 6px; }
.modal-count-item .count-value { font-size: 1.6rem; font-weight: 900; color: #00d4ff; line-height: 1; }
.modal-count-item.lifetime { background: linear-gradient(135deg, rgba(255,215,0,0.18) 0%, rgba(255,215,0,0.05) 100%); border-color: rgba(255,215,0,0.5); }
.modal-count-item.lifetime .count-value { color: #ffd700; }
.modal-counts.undead .modal-count-item { background: linear-gradient(135deg, rgba(140,160,100,0.2) 0%, rgba(140,160,100,0.06) 100%); border-color: rgba(140,160,100,0.5); }
.modal-counts.undead .modal-count-item .count-value { color: #a8b878; }
.modal-counts.undead .modal-count-item.lifetime { background: linear-gradient(135deg, rgba(200,180,100,0.2) 0%, rgba(200,180,100,0.06) 100%); border-color: rgba(200,180,100,0.6); }
.modal-counts.undead .modal-count-item.lifetime .count-value { color: #e0d090; }

@media (max-width: 700px) {
    body { padding: 8px; padding-top: 12px; }
    .header h1 { font-size: 1.5rem; }
    .player-card { padding: 12px; border-radius: 14px; }
    .player-header { flex-direction: column; text-align: center; }
    .collection-progress { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr; }
    .fish-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .fish-icon { width: 44px; height: 44px; }
    .modal-fish-icon { width: 120px; height: 120px; }
    .fish-modal { padding: 24px 20px 20px; }
    .modal-fish-name { font-size: 1.3rem; }
    .modal-counts { grid-template-columns: 1fr; }
    .fish-modal.boss-modal .modal-fish-icon { width: 180px; height: 180px; }
    .fish-modal.boss-modal .modal-fish-name { font-size: 1.8rem; }
    .fish-item.boss .boss-icon-wrap { width: 80px; height: 80px; }
    .filter-bar { flex-direction: column; align-items: stretch; }
    .filter-btn { width: 100%; text-align: center; }
}
</style>

<body>
<div class="container">
    <div class="header">
        <a href="index.html" style="text-decoration:none;">
            <h1>🎣 Инвентарь рыбака</h1>
        </a>
        <p class="subtitle">Личная статистика · <a href="index.html">← на главную</a></p>
    </div>

    <div class="player-card" id="playerCard">
        <div class="loading">Загрузка инвентаря...</div>
    </div>

    <div class="last-update" id="lastUpdate" style="display: none; text-align:center; margin-top:20px; color: var(--text-muted); font-size: 0.8rem;">
        🕒 Обновлено: <span class="update-time" id="updateTime"></span>
    </div>
</div>

<div class="modal-overlay" id="fishModal">
    <div class="fish-modal" id="fishModalContent"></div>
</div>

<script src="./data.js"></script>
<script src="./fish-icons.js"></script>
<script>
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function normalizeKey(s) { return s === null || s === undefined ? '' : String(s).toLowerCase().replace(/ё/g, 'е').trim(); }
function findNormalized(obj, targetKey) {
    if (!obj || typeof obj !== 'object') return null;
    const target = normalizeKey(targetKey);
    for (const k in obj) { if (normalizeKey(k) === target) return { key: k, value: obj[k] }; }
    return null;
}

const ALL_FISH = ["Щука", "Форель", "Толстолобик", "Судак", "Сом", "Пескарь", "Окунь", "Налим", "Лосось", "Линь", "Лещ", "Краснопёрка", "Карп", "Карась", "Ёрш", "Уклейка", "Сазан", "Осётр", "Хариус", "Минога", "Голец", "Белый амур", "Сиг", "Змееголов", "Угорь", "Чоп", "Пиранья", "Плотва", "Язь", "Голавль"];
const HALLOWEEN_FISH = ["Мразь карась", "Назойливая тыковка", "Щука падлюка", "Краб шкраб", "Осётр Пётр", "Удильщик", "Луна в костюме луны", "Клоун в костюме клоуна", "Судак дурак", "Писклявый пескарь"];
const BOSS_FISH = ["Босс Лосось"];

const FISH_DATA = {
    'Щука': { min: 10, max: 120, rarity: 'rare' }, 'Форель': { min: 10, max: 70, rarity: 'rare' }, 'Карп': { min: 20, max: 100, rarity: 'rare' }, 'Окунь': { min: 10, max: 40, rarity: 'common' }, 'Сом': { min: 10, max: 250, rarity: 'legendary' }, 'Осётр': { min: 20, max: 200, rarity: 'legendary' }, 'Пиранья': { min: 5, max: 30, rarity: 'legendary' }, 'Лосось': { min: 20, max: 120, rarity: 'epic' }, 'Уклейка': { min: 5, max: 15, rarity: 'common' }, 'Плотва': { min: 7, max: 30, rarity: 'common' }, 'Ёрш': { min: 5, max: 20, rarity: 'common' }, 'Лещ': { min: 15, max: 60, rarity: 'common' }, 'Голавль': { min: 10, max: 60, rarity: 'common' }, 'Язь': { min: 10, max: 60, rarity: 'common' }, 'Линь': { min: 20, max: 50, rarity: 'common' }, 'Судак': { min: 10, max: 90, rarity: 'rare' }, 'Голец': { min: 20, max: 60, rarity: 'common' }, 'Сиг': { min: 20, max: 60, rarity: 'rare' }, 'Хариус': { min: 20, max: 50, rarity: 'rare' }, 'Змееголов': { min: 20, max: 100, rarity: 'rare' }, 'Налим': { min: 20, max: 80, rarity: 'rare' }, 'Минога': { min: 15, max: 40, rarity: 'epic' }, 'Толстолобик': { min: 10, max: 100, rarity: 'epic' }, 'Белый амур': { min: 30, max: 120, rarity: 'epic' }, 'Угорь': { min: 20, max: 150, rarity: 'epic' }, 'Чоп': { min: 5, max: 30, rarity: 'common' }, 'Сазан': { min: 20, max: 100, rarity: 'epic' }, 'Карась': { min: 10, max: 40, rarity: 'common' }, 'Краснопёрка': { min: 5, max: 35, rarity: 'common' }, 'Пескарь': { min: 5, max: 15, rarity: 'common' },
    'Мразь карась': { min: 10, max: 40, rarity: 'rare' }, 'Назойливая тыковка': { min: 10, max: 30, rarity: 'common' }, 'Щука падлюка': { min: 30, max: 100, rarity: 'rare' }, 'Краб шкраб': { min: 10, max: 40, rarity: 'epic' }, 'Осётр Пётр': { min: 50, max: 180, rarity: 'legendary' }, 'Удильщик': { min: 20, max: 80, rarity: 'legendary' }, 'Луна в костюме луны': { min: 20, max: 60, rarity: 'epic' }, 'Клоун в костюме клоуна': { min: 10, max: 40, rarity: 'rare' }, 'Судак дурак': { min: 20, max: 70, rarity: 'rare' }, 'Писклявый пескарь': { min: 5, max: 20, rarity: 'common' },
    'Босс Лосось': { min: 2000, max: 2000, rarity: 'boss' }
};
const RARITY_INFO = { common: { label: 'Обычная', icon: '⚪' }, rare: { label: 'Редкая', icon: '🔷' }, epic: { label: 'Эпическая', icon: '💜' }, legendary: { label: 'Легендарная', icon: '⭐' }, boss: { label: 'БОСС', icon: '💀' } };

function getFishInfo(fishName) {
    const info = getFishForm(fishName);
    let data = null;
    for (const key in FISH_DATA) {
        if (normalizeKey(key) === normalizeKey(info.baseName)) { data = FISH_DATA[key]; break; }
    }
    if (!data) data = FISH_DATA['Плотва'];
    return { isUndead: info.isUndead, baseName: info.baseName, min: data.min, max: data.max, rarity: (data.rarity || 'common').toLowerCase() };
}
function getLifetimeCountForPlayer(playerName, fishName) {
    if (!window._lifetimeCatches) return 0;
    const playerEntry = findNormalized(window._lifetimeCatches, playerName);
    if (!playerEntry) return 0;
    const fishEntry = findNormalized(playerEntry.value, fishName);
    return fishEntry ? fishEntry.value : 0;
}
function getPersonalRecordForPlayer(playerName, fishName) {
    if (!window._personalRecords) return null;
    const targetKey = normalizeKey(playerName) + '|' + normalizeKey(fishName);
    if (window._personalRecords[targetKey] !== undefined) return window._personalRecords[targetKey];
    for (const k in window._personalRecords) {
        const parts = k.split('|');
        if (parts.length !== 2) continue;
        if (normalizeKey(parts[0]) === normalizeKey(playerName) && normalizeKey(parts[1]) === normalizeKey(fishName)) return window._personalRecords[k];
    }
    return null;
}

const DATA_URL = 'data.json';
let currentModalFish = null;
let isFirstRender = true;
let activeCategoryInv = 'all';
let currentInventory = null;

const urlParams = new URLSearchParams(window.location.search);
let playerName = urlParams.get('player');
if (!playerName) { 
    playerName = localStorage.getItem('last_player') || 'gans_mann'; 
    window.history.replaceState({}, '', `?player=${encodeURIComponent(playerName)}`); 
} else { 
    localStorage.setItem('last_player', playerName); 
}

const playerCard = document.getElementById('playerCard');

loadAndRender(false);
setInterval(() => { if (!document.hidden) loadAndRender(true); }, 20000);

function loadAndRender(silent) {
    fetch(DATA_URL + '?t=' + Date.now() + '&v=2')
        .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
        .then(data => {
            const newJson = JSON.stringify(data);
            if (silent && window._lastJson === newJson) return;
            window._lastJson = newJson;

            if (data._lastUpdate) {
                document.getElementById('updateTime').textContent = data._lastUpdate;
                document.getElementById('lastUpdate').style.display = 'block';
            }
            if (data._records) window._records = data._records;
            if (data._personalRecords) window._personalRecords = data._personalRecords;
            if (data._lifetimeCatches) window._lifetimeCatches = data._lifetimeCatches;
            if (data._halloweenCollection) window._halloweenCollection = data._halloweenCollection;

            let playerKey = null;
            for (const key in data) {
                if (key.startsWith('_')) continue;
                if (normalizeKey(key) === normalizeKey(playerName)) { playerKey = key; break; }
            }

            if (!playerKey) {
                if (isFirstRender) {
                    playerCard.innerHTML = `<div class="error"><p style="font-size: 1.1rem; margin-bottom: 8px;">Игрок не найден</p><p style="color: rgba(255,255,255,0.5);">@${playerName} ещё не ловил рыбу</p></div>`;
                    isFirstRender = false;
                }
                return;
            }

            if (isFirstRender) {
                currentInventory = data[playerKey];
                renderInventory(playerName, currentInventory);
                isFirstRender = false;
            } else {
                currentInventory = data[playerKey];
                updateInventoryCounts(currentInventory);
            }

            if (currentModalFish) {
                const fishEntry = findNormalized(currentInventory, currentModalFish);
                refreshOpenModal(currentModalFish, fishEntry ? fishEntry.value : 0);
            }
        })
        .catch(err => {
            if (window.DEFAULT_DATA && isFirstRender) {
                const data = window.DEFAULT_DATA;
                if (data._records) window._records = data._records;
                if (data._personalRecords) window._personalRecords = data._personalRecords;
                if (data._lifetimeCatches) window._lifetimeCatches = data._lifetimeCatches;
                if (data._halloweenCollection) window._halloweenCollection = data._halloweenCollection;
                let playerKey = null;
                for (const key in data) { if (key.startsWith('_')) continue; if (normalizeKey(key) === normalizeKey(playerName)) { playerKey = key; break; } }
                if (playerKey) {
                    currentInventory = data[playerKey];
                    renderInventory(playerName, currentInventory);
                    isFirstRender = false; return;
                }
            }
        });
}

function updateInventoryCounts(inventory) {
    let totalRegular = 0, totalUndead = 0, totalHalloween = 0;
    const regularSet = new Set(), undeadSet = new Set(), halloweenSet = new Set();
    for (const [fish, count] of Object.entries(inventory)) {
        if (count <= 0) continue;
        const isUndead = normalizeKey(fish).startsWith('нежить ');
        const baseFish = isUndead ? fish.substring(7).trim() : fish;
        const baseNorm = normalizeKey(baseFish);
        if (isUndead) { totalUndead += count; undeadSet.add(baseNorm); }
        else if (HALLOWEEN_FISH.some(hf => normalizeKey(hf) === normalizeKey(fish))) { totalHalloween += count; halloweenSet.add(normalizeKey(fish)); }
        else if (BOSS_FISH.some(bf => normalizeKey(bf) === normalizeKey(fish))) { /* босс */ }
        else { totalRegular += count; regularSet.add(baseNorm); }
    }
    const caughtHalloweenList = window._halloweenCollection ? window._halloweenCollection[playerName.toLowerCase()] || [] : [];
    const halloweenColSet = new Set(caughtHalloweenList.map(normalizeKey));
    let regCaught = 0, undCaught = 0, halCaught = 0;
    ALL_FISH.forEach(fish => { if (regularSet.has(normalizeKey(fish))) regCaught++; if (undeadSet.has(normalizeKey(fish))) undCaught++; });
    HALLOWEEN_FISH.forEach(fish => { if (halloweenColSet.has(normalizeKey(fish)) || halloweenSet.has(normalizeKey(fish))) halCaught++; });

    document.getElementById('total-caught').textContent = totalRegular + totalUndead + totalHalloween;
    document.getElementById('total-regular').textContent = totalRegular;
    document.getElementById('total-undead').textContent = totalUndead;
    document.getElementById('total-halloween').textContent = totalHalloween;
    const pFills = document.querySelectorAll('.progress-fill');
    if (pFills.length >= 3) { pFills[0].style.width = Math.round(regCaught/30*100) + '%'; pFills[1].style.width = Math.round(undCaught/30*100) + '%'; pFills[2].style.width = Math.round(halCaught/10*100) + '%'; }
    const pHdrs = document.querySelectorAll('.progress-header .count');
    if (pHdrs.length >= 3) { pHdrs[0].textContent = `${regCaught} / 30`; pHdrs[1].textContent = `${undCaught} / 30`; pHdrs[2].textContent = `${halCaught} / 10`; }

    document.querySelectorAll('.fish-item').forEach(item => {
        const fishName = item.getAttribute('data-fish');
        const countEl = item.querySelector('.fish-count');
        if (!fishName || !countEl) return;
        const entry = findNormalized(inventory, fishName);
        const newCount = entry ? entry.value : 0;
        const oldText = countEl.textContent.replace('×', '');
        if (oldText !== String(newCount)) {
            countEl.textContent = `×${newCount}`;
            if (oldText === '0' && newCount > 0) {
                const info = getFishInfo(fishName);
                const isUndead = normalizeKey(fishName).startsWith('нежить ');
                const isHalloween = HALLOWEEN_FISH.some(hf => normalizeKey(hf) === normalizeKey(fishName));
                const isBoss = BOSS_FISH.some(bf => normalizeKey(bf) === normalizeKey(fishName));
                let newClass = 'fish-item ';
                if (isUndead) newClass += 'undead rarity-' + info.rarity;
                else if (isHalloween) newClass += 'halloween rarity-' + info.rarity;
                else if (isBoss) newClass += 'boss';
                else newClass += 'rarity-' + info.rarity;
                item.className = newClass;
                const img = item.querySelector('.fish-icon');
                if (img) img.style.opacity = '1';
            }
        }
    });
}

function renderInventory(playerName, inventory) {
    let totalRegular = 0, totalUndead = 0, totalHalloween = 0;
    const regularSet = new Set(), undeadSet = new Set(), halloweenSet = new Set();
    for (const [fish, count] of Object.entries(inventory)) {
        if (count <= 0) continue;
        const isUndead = normalizeKey(fish).startsWith('нежить ');
        const baseFish = isUndead ? fish.substring(7).trim() : fish;
        const baseNorm = normalizeKey(baseFish);
        if (isUndead) { totalUndead += count; undeadSet.add(baseNorm); }
        else if (HALLOWEEN_FISH.some(hf => normalizeKey(hf) === normalizeKey(fish))) { totalHalloween += count; halloweenSet.add(normalizeKey(fish)); }
        else if (BOSS_FISH.some(bf => normalizeKey(bf) === normalizeKey(fish))) { /* босс */ }
        else { totalRegular += count; regularSet.add(baseNorm); }
    }
    const caughtHalloweenList = window._halloweenCollection ? window._halloweenCollection[playerName.toLowerCase()] || [] : [];
    const halloweenColSet = new Set(caughtHalloweenList.map(normalizeKey));
    const total = totalRegular + totalUndead + totalHalloween;
    const firstLetter = playerName.charAt(0).toUpperCase();

    let regCaught = 0, undCaught = 0, halCaught = 0;
    ALL_FISH.forEach(fish => { if (regularSet.has(normalizeKey(fish))) regCaught++; if (undeadSet.has(normalizeKey(fish))) undCaught++; });
    HALLOWEEN_FISH.forEach(fish => { if (halloweenColSet.has(normalizeKey(fish)) || halloweenSet.has(normalizeKey(fish))) halCaught++; });

    let html = `
        <div class="player-header">
            <div class="player-avatar">${firstLetter}</div>
            <div class="player-info">
                <h2>@${playerName}</h2>
                <div class="player-stats">Всего поймано: <span id="total-caught">${total}</span> рыб</div>
            </div>
            <a href="https://twitch.tv/${escapeHtml(playerName)}" target="_blank" class="twitch-link">📺 Twitch</a>
        </div>

        <div class="collection-progress">
            <div class="progress-block">
                <div class="progress-header"><span class="label">🐟 Обычные</span><span class="count">${regCaught} / 30</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round(regCaught/30*100)}%"></div></div>
            </div>
            <div class="progress-block undead">
                <div class="progress-header"><span class="label">🧟 Нежить</span><span class="count">${undCaught} / 30</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round(undCaught/30*100)}%"></div></div>
            </div>
            <div class="progress-block halloween">
                <div class="progress-header"><span class="label">🎃 Хэллоуин</span><span class="count">${halCaught} / 10</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round(halCaught/10*100)}%"></div></div>
            </div>
        </div>

        <a href="aquarium.html?type=regular&player=${encodeURIComponent(playerName)}" class="aquarium-single-btn">
            🐠 Перейти в аквариум
        </a>

        <div class="stats-grid">
            <div class="stat-box"><div class="stat-icon">🐟</div><div class="stat-value" id="total-regular">${totalRegular}</div><div class="stat-label">Обычные</div></div>
            <div class="stat-box undead"><div class="stat-icon">🧟</div><div class="stat-value" id="total-undead">${totalUndead}</div><div class="stat-label">Нежить</div></div>
            <div class="stat-box" style="--c: #ff8c00;"><div class="stat-icon">🎃</div><div class="stat-value" id="total-halloween" style="color: #ff8c00;">${totalHalloween}</div><div class="stat-label">Хэллоуин</div></div>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-cat="all">Все рыбы</button>
            <button class="filter-btn" data-cat="regular">Обычные (30)</button>
            <button class="filter-btn" data-cat="undead">Нежить (30)</button>
            <button class="filter-btn" data-cat="halloween">Хэллоуин (10)</button>
            <input type="text" class="filter-search-input" id="invFilterInput" placeholder="🔍 Найти рыбу по имени...">
        </div>
    `;

    html += `<div id="cat-regular"><div class="fish-section"><h3>🐟 Обычные рыбы</h3><div class="fish-grid">`;
    ALL_FISH.forEach(fish => {
        const isCaught = regularSet.has(normalizeKey(fish));
        const count = findNormalized(inventory, fish)?.value || 0;
        const itemClass = isCaught ? `rarity-${getFishInfo(fish).rarity}` : 'not-caught';
        html += `<div class="fish-item ${itemClass}" data-fish="${fish}" data-name="${escapeHtml(fish).toLowerCase()}"><div class="fish-item-inner"></div><img src="${getFishIcon(fish)}" class="fish-icon" alt="${fish}"><span class="fish-name">${fish}</span><span class="fish-count">×${count}</span></div>`;
    });
    html += `</div></div></div>`;

    html += `<div id="cat-undead"><div class="fish-section undead-section" style="margin-top: 14px;"><h3>🧟 Нежить</h3><div class="fish-grid">`;
    ALL_FISH.forEach(fish => {
        const isCaught = undeadSet.has(normalizeKey(fish));
        const undeadName = 'Нежить ' + fish.toLowerCase();
        const count = findNormalized(inventory, undeadName)?.value || 0;
        const itemClass = isCaught ? `undead rarity-${getFishInfo(undeadName).rarity}` : 'not-caught';
        html += `<div class="fish-item ${itemClass}" data-fish="${undeadName}" data-name="${escapeHtml(undeadName).toLowerCase()}"><div class="fish-item-inner"></div><img src="${getFishIcon(undeadName)}" class="fish-icon" alt="${fish}"><span class="fish-name">${fish}</span><span class="fish-count">×${count}</span></div>`;
    });
    html += `</div></div></div>`;

    html += `<div id="cat-halloween"><div class="fish-section halloween-section" style="margin-top: 14px;"><h3>🎃 Хэллоуин</h3><div class="fish-grid">`;
    HALLOWEEN_FISH.forEach(fish => {
        const isCaught = halloweenSet.has(normalizeKey(fish)) || halloweenColSet.has(normalizeKey(fish));
        const count = findNormalized(inventory, fish)?.value || 0;
        const itemClass = isCaught ? `halloween rarity-${getFishInfo(fish).rarity}` : 'not-caught';
        html += `<div class="fish-item ${itemClass}" data-fish="${fish}" data-name="${escapeHtml(fish).toLowerCase()}"><div class="fish-item-inner"></div><img src="${getFishIcon(fish)}" class="fish-icon" alt="${fish}"><span class="fish-name">${fish}</span><span class="fish-count">×${count}</span></div>`;
    });
    html += `</div></div></div>`;

    html += `<div id="cat-boss" style="margin-top: 14px;"><div class="fish-section boss-section"><h3>💀 Боссы</h3><div class="fish-grid">`;
    BOSS_FISH.forEach(fish => {
        const count = findNormalized(inventory, fish)?.value || 0;
        const isCaught = count > 0 || getLifetimeCountForPlayer(playerName, fish) > 0 || getPersonalRecordForPlayer(playerName, fish) !== null;
        const itemClass = isCaught ? 'boss' : 'boss not-caught';
        html += `<div class="fish-item ${itemClass}" data-fish="${fish}" data-name="${escapeHtml(fish).toLowerCase()}">
            <div class="fish-item-inner"></div>
            <div class="boss-icon-wrap"><img src="${getFishIcon(fish, 2)}" style="width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;" /></div>
            <span class="fish-name">${fish}</span>
            <span class="fish-count">×${count}</span>
        </div>`;
    });
    html += `</div></div></div>`;

    playerCard.innerHTML = html;

    document.querySelectorAll('.fish-item').forEach(item => {
        item.addEventListener('click', function(e) {
            e.stopPropagation();
            showFishModal(this.getAttribute('data-fish'), parseInt(this.querySelector('.fish-count').textContent.replace('×', ''), 10));
        });
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategoryInv = btn.getAttribute('data-cat');
            applyInvFilter();
        });
    });
    const invInput = document.getElementById('invFilterInput');
    if (invInput) invInput.addEventListener('input', applyInvFilter);
}

function applyInvFilter() {
    const text = (document.getElementById('invFilterInput')?.value || '').trim().toLowerCase();
    const reg = document.getElementById('cat-regular');
    const und = document.getElementById('cat-undead');
    const hal = document.getElementById('cat-halloween');
    const bos = document.getElementById('cat-boss');

    if (activeCategoryInv === 'all') { reg.style.display = ''; und.style.display = ''; hal.style.display = ''; bos.style.display = ''; }
    else if (activeCategoryInv === 'regular') { reg.style.display = ''; und.style.display = 'none'; hal.style.display = 'none'; bos.style.display = 'none'; }
    else if (activeCategoryInv === 'undead') { reg.style.display = 'none'; und.style.display = ''; hal.style.display = 'none'; bos.style.display = 'none'; }
    else if (activeCategoryInv === 'halloween') { reg.style.display = 'none'; und.style.display = 'none'; hal.style.display = ''; bos.style.display = 'none'; }

    document.querySelectorAll('.fish-item').forEach(item => {
        const name = item.getAttribute('data-name') || '';
        item.style.display = (!text || name.includes(text)) ? 'flex' : 'none';
    });
}

function showFishModal(fishName, count) {
    currentModalFish = fishName;
    const info = getFishInfo(fishName);
    const rarity = RARITY_INFO[info.rarity];
    let lifetimeCount = getLifetimeCountForPlayer(playerName, fishName) || (count > 0 ? count : 0);
    const personalRecord = getPersonalRecordForPlayer(playerName, fishName);

    let recordHtml = personalRecord !== null ? `<div class="info-value record">${personalRecord} см</div>` : `<div class="info-value no-record">не установлен</div>`;
    const displayName = info.isUndead ? '🧟 ' + info.baseName : info.baseName;
    const isBoss = info.rarity === 'boss';
    const bigIcon = getFishIcon(fishName, isBoss ? 6 : 5);

    const cornerSVG = `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M 5 5 Q 5 20 15 20 Q 28 20 28 10 Q 28 5 18 5 Q 12 5 12 12"/><path d="M 10 10 Q 10 18 20 18"/><circle cx="15" cy="15" r="2" fill="currentColor" stroke="none"/><path d="M 5 5 L 10 10" stroke-opacity="0.5"/></svg>`;
    let particlesHtml = '', holoHtml = '', crownHtml = '', gemsHtml = '';
    if (isBoss || info.rarity === 'legendary' || info.rarity === 'epic') {
        particlesHtml = '<div class="modal-particles">';
        const pCount = isBoss ? 30 : 12;
        for (let i = 0; i < pCount; i++) particlesHtml += `<div class="particle" style="left: ${5 + Math.random()*90}%; top: ${20 + Math.random()*70}%; animation-delay: ${Math.random()*4}s; animation-duration: ${3+Math.random()*2}s;"></div>`;
        particlesHtml += '</div>';
    }
    if (isBoss || info.rarity === 'legendary') crownHtml = `<div class="modal-crown">${isBoss ? '💀' : (info.isUndead ? '💀' : '👑')}</div>`;

    const modal = document.getElementById('fishModalContent');
    modal.className = 'fish-modal ' + (isBoss ? 'boss-modal' : 'rarity-' + info.rarity) + (info.isUndead ? ' undead' : '');
    modal.innerHTML = `
    <div class="modal-corner tl">${cornerSVG}</div><div class="modal-corner tr">${cornerSVG}</div>
    <div class="modal-corner bl">${cornerSVG}</div><div class="modal-corner br">${cornerSVG}</div>
    ${particlesHtml}${crownHtml}
    <button class="modal-close" onclick="closeFishModal()">✕</button>
    <div class="modal-fish-icon-wrap"><img src="${bigIcon}" class="modal-fish-icon"></div>
    <div class="modal-fish-name ${info.isUndead ? 'undead' : ''}">${displayName}</div>
    <div class="modal-rarity rarity-${info.rarity}">${rarity.icon} ${rarity.label.toUpperCase()}</div>
    <div class="modal-info-grid">
        <div class="modal-info-block"><div class="info-label">Размер</div><div class="info-value">${isBoss ? '2000 см' : info.min + '–' + info.max + ' см'}</div></div>
        <div class="modal-info-block"><div class="info-label">Твой рекорд</div>${recordHtml}</div>
    </div>
    <div class="modal-counts ${info.isUndead ? 'undead' : ''}">
        <div class="modal-count-item"><div class="count-label">📦 В инвентаре</div><div class="count-value">${count}</div></div>
        <div class="modal-count-item lifetime"><div class="count-label">🏆 Поймано за всё время</div><div class="count-value">${lifetimeCount}</div></div>
    </div>`;
    document.getElementById('fishModal').classList.add('show');
}

function closeFishModal() { document.getElementById('fishModal').classList.remove('show'); currentModalFish = null; }

function refreshOpenModal(fishName, count) {
    const modal = document.getElementById('fishModalContent');
    if (!modal) return;
    let lifetimeCount = getLifetimeCountForPlayer(playerName, fishName) || (count > 0 ? count : 0);
    const setCountValue = (el, newValue) => { if (!el) return; if (el.textContent.trim() !== String(newValue)) { el.textContent = newValue; } };
    const countItems = modal.querySelectorAll('.modal-count-item .count-value');
    if (countItems.length >= 1) setCountValue(countItems[0], count);
    if (countItems.length >= 2) setCountValue(countItems[1], lifetimeCount);
    const recordBlock = modal.querySelector('.modal-info-block:last-child');
    if (recordBlock) {
        const recordValueEl = recordBlock.querySelector('.info-value');
        if (recordValueEl) {
            const personalRecord = getPersonalRecordForPlayer(playerName, fishName);
            if (personalRecord !== null) { recordValueEl.className = 'info-value record'; recordValueEl.textContent = personalRecord + ' см'; }
            else { recordValueEl.className = 'info-value no-record'; recordValueEl.textContent = 'не установлен'; }
        }
    }
}
document.getElementById('fishModal').addEventListener('click', function(e) { if (e.target === this) closeFishModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeFishModal(); });
</script>
</body>
</html>
