<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инвентарь рыбака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* Здесь весь CSS из вашего файла inventory.html. 
   Для экономии места я не буду дублировать 1000 строк CSS.
   Вам нужно взять ВАШ старый CSS и добавить в конец эти 4 класса: */
   
.fish-item:not(.not-caught).halloween.rarity-common {
    color: rgba(255, 165, 0, 0.9); border-color: rgba(255, 140, 0, 0.6);
    background: linear-gradient(135deg, rgba(255, 140, 0, 0.25) 0%, rgba(139, 69, 19, 0.15) 100%);
}
.fish-item:not(.not-caught).halloween.rarity-rare {
    color: #ff8c00; border-color: rgba(255, 165, 0, 0.8);
    background: linear-gradient(135deg, rgba(255, 140, 0, 0.35) 0%, rgba(255, 69, 0, 0.2) 100%);
    box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
}
.fish-item:not(.not-caught).halloween.rarity-epic {
    color: #ba55d3; border-color: rgba(186, 85, 211, 0.8);
    background: linear-gradient(135deg, rgba(186, 85, 211, 0.3) 0%, rgba(75, 0, 130, 0.2) 100%);
    box-shadow: 0 0 20px rgba(186, 85, 211, 0.4);
}
.fish-item:not(.not-caught).halloween.rarity-legendary {
    color: #ffd700; border-color: rgba(255, 140, 0, 0.9);
    background: linear-gradient(135deg, rgba(255, 140, 0, 0.4) 0%, rgba(139, 0, 0, 0.3) 100%);
    box-shadow: 0 0 25px rgba(255, 140, 0, 0.5); animation: legendaryPulse 3s ease-in-out infinite;
}
.fish-section.halloween-section h3::before { background: linear-gradient(135deg, #ff8c00, #ffd700); }
</style>
</head>
<body>
<div class="container">
    <div class="header">
    <a href="/" style="text-decoration:none;">
        <h1>🎣 Инвентарь рыбака</h1>
    </a>
    <p class="subtitle">Личная статистика · <a href="/" style="color:#00d4ff;text-decoration:none;">← на главную</a></p>
</div>

    <div class="player-card" id="playerCard">
        <div class="loading">Загрузка инвентаря...</div>
    </div>

    <div class="last-update" id="lastUpdate" style="display: none;">
        🕒 Обновлено: <span class="update-time" id="updateTime"></span>
    </div>
</div>

<div class="modal-overlay" id="fishModal">
    <div class="fish-modal" id="fishModalContent"></div>
</div>
    
<script src="/fish-icons.js"></script>
<script>
function normalizeKey(s) { return s === null || s === undefined ? '' : String(s).toLowerCase().replace(/ё/g, 'е').trim(); }
function findNormalized(obj, targetKey) {
    if (!obj || typeof obj !== 'object') return null;
    const target = normalizeKey(targetKey);
    for (const k in obj) { if (normalizeKey(k) === target) return { key: k, value: obj[k] }; }
    return null;
}

const ALL_FISH = [
    "Щука", "Форель", "Толстолобик", "Судак", "Сом",
    "Пескарь", "Окунь", "Налим", "Лосось", "Линь",
    "Лещ", "Краснопёрка", "Карп", "Карась", "Ёрш",
    "Уклейка", "Сазан", "Осётр", "Хариус", "Минога",
    "Голец", "Белый амур", "Сиг", "Змееголов", "Угорь",
    "Чоп", "Пиранья", "Плотва", "Язь", "Голавль"
];

const HALLOWEEN_FISH = [
    "Назойливая тыковка", "Щука падлюка", "Краб шкраб", "Осётр Пётр", "Удильщик", 
    "Луна в костюме луны", "Клоун в костюме клоуна", "Судак дурак", "Писклявый пескарь"
];

const FISH_DATA = {
    'Щука': { min: 10, max: 120, rarity: 'rare' }, 'Форель': { min: 10, max: 70, rarity: 'rare' },
    'Карп': { min: 20, max: 100, rarity: 'rare' }, 'Окунь': { min: 10, max: 40, rarity: 'common' },
    'Сом': { min: 10, max: 250, rarity: 'legendary' }, 'Осётр': { min: 20, max: 200, rarity: 'legendary' },
    'Пиранья': { min: 5, max: 30, rarity: 'legendary' }, 'Лосось': { min: 20, max: 120, rarity: 'epic' },
    'Уклейка': { min: 5, max: 15, rarity: 'common' }, 'Плотва': { min: 7, max: 30, rarity: 'common' },
    'Ёрш': { min: 5, max: 20, rarity: 'common' }, 'Лещ': { min: 15, max: 60, rarity: 'common' },
    'Голавль': { min: 10, max: 60, rarity: 'common' }, 'Язь': { min: 10, max: 60, rarity: 'common' },
    'Линь': { min: 20, max: 50, rarity: 'common' }, 'Судак': { min: 10, max: 90, rarity: 'rare' },
    'Голец': { min: 20, max: 60, rarity: 'common' }, 'Сиг': { min: 20, max: 60, rarity: 'rare' },
    'Хариус': { min: 20, max: 50, rarity: 'rare' }, 'Змееголов': { min: 20, max: 100, rarity: 'rare' },
    'Налим': { min: 20, max: 80, rarity: 'rare' }, 'Минога': { min: 15, max: 40, rarity: 'epic' },
    'Толстолобик': { min: 10, max: 100, rarity: 'epic' }, 'Белый амур': { min: 30, max: 120, rarity: 'epic' },
    'Угорь': { min: 20, max: 150, rarity: 'epic' }, 'Чоп': { min: 5, max: 30, rarity: 'common' },
    'Сазан': { min: 20, max: 100, rarity: 'epic' }, 'Карась': { min: 10, max: 40, rarity: 'common' },
    'Краснопёрка': { min: 5, max: 35, rarity: 'common' }, 'Пескарь': { min: 5, max: 15, rarity: 'common' },
    // ХЭЛЛОУИН
    'Назойливая тыковка': { min: 10, max: 30, rarity: 'common' },
    'Щука падлюка': { min: 30, max: 100, rarity: 'rare' },
    'Краб шкраб': { min: 10, max: 40, rarity: 'epic' },
    'Осётр Пётр': { min: 50, max: 180, rarity: 'legendary' },
    'Удильщик': { min: 20, max: 80, rarity: 'legendary' },
    'Луна в костюме луны': { min: 20, max: 60, rarity: 'epic' },
    'Клоун в костюме клоуна': { min: 10, max: 40, rarity: 'rare' },
    'Судак дурак': { min: 20, max: 70, rarity: 'rare' },
    'Писклявый пескарь': { min: 5, max: 20, rarity: 'common' }
};
const RARITY_INFO = {
    common: { label: 'Обычная', color: '#8ab4d6', icon: '⚪' }, rare: { label: 'Редкая', color: '#00d4ff', icon: '🔷' },
    epic: { label: 'Эпическая', color: '#a78bfa', icon: '💜' }, legendary: { label: 'Легендарная', color: '#ffd700', icon: '⭐' }
};

function getFishInfo(fishName) {
    const info = getFishForm(fishName);
    let data = null;
    for (const key in FISH_DATA) {
        if (normalizeKey(key) === normalizeKey(info.baseName)) { data = FISH_DATA[key]; break; }
    }
    if (!data) data = FISH_DATA['Плотва'];
    return { isUndead: info.isUndead, baseName: info.baseName, min: data.min, max: data.max, rarity: (data.rarity || 'common').toLowerCase() };
}

function getLifetimeCountForPlayer(playerName, fishName) {
    if (!window._lifetimeCatches) return 0;
    const playerEntry = findNormalized(window._lifetimeCatches, playerName);
    if (!playerEntry) return 0;
    const fishEntry = findNormalized(playerEntry.value, fishName);
    return fishEntry ? fishEntry.value : 0;
}
function getPersonalRecordForPlayer(playerName, fishName) {
    if (!window._personalRecords) return null;
    const targetKey = normalizeKey(playerName) + '|' + normalizeKey(fishName);
    if (window._personalRecords[targetKey] !== undefined) return window._personalRecords[targetKey];
    for (const k in window._personalRecords) {
        const parts = k.split('|');
        if (parts.length !== 2) continue;
        if (normalizeKey(parts[0]) === normalizeKey(playerName) && normalizeKey(parts[1]) === normalizeKey(fishName)) return window._personalRecords[k];
    }
    return null;
}

const DATA_URL = '/data.json';
let currentModalFish = null;

function loadAndRender(silent) {
    fetch(DATA_URL + '?t=' + Date.now())
        .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
        .then(data => {
            const newJson = JSON.stringify(data);
            if (silent && window._lastJson === newJson) return;
            window._lastJson = newJson;

            if (data._lastUpdate) {
                document.getElementById('updateTime').textContent = data._lastUpdate;
                document.getElementById('lastUpdate').style.display = 'block';
            }

            if (data._personalRecords) window._personalRecords = data._personalRecords;
            if (data._lifetimeCatches) window._lifetimeCatches = data._lifetimeCatches;
            if (data._halloweenCollection) window._halloweenCollection = data._halloweenCollection; // НОВОЕ

            let playerKey = null;
            for (const key in data) {
                if (key.startsWith('_')) continue;
                if (normalizeKey(key) === normalizeKey(playerName)) { playerKey = key; break; }
            }

            if (!playerKey) {
                playerCard.innerHTML = `<div class="error"><p style="font-size: 1.1rem; margin-bottom: 8px;">Игрок не найден</p><p style="color: rgba(255,255,255,0.5);">@${playerName} ещё не ловил рыбу</p></div>`;
                return;
            }

            renderInventory(playerKey, data[playerKey]);

            if (currentModalFish) {
                const fishData = data[playerKey];
                const fishEntry = findNormalized(fishData, currentModalFish);
                const currentCount = fishEntry ? fishEntry.value : 0;
                refreshOpenModal(currentModalFish, currentCount);
            }
        })
        .catch(err => {
            if (!silent) {
                console.error(err);
                playerCard.innerHTML = `<div class="error"><p style="font-size: 1.1rem; margin-bottom: 8px;">Не удалось загрузить данные</p><p style="color: rgba(255,255,255,0.5);">Попробуйте позже</p><p style="color: rgba(255,255,255,0.3); font-size: 0.75rem; margin-top: 8px;">${err.message}</p></div>`;
            }
        });
}

const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get('player');
const playerCard = document.getElementById('playerCard');

if (!playerName) {
    playerCard.innerHTML = `<div class="error"><p style="font-size: 1.1rem; margin-bottom: 8px;">🎣 Укажите ник игрока в адресе</p><p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">Пример: <code style="background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px;">?player=ваш_ник</code></p></div>`;
} else {
    loadAndRender(false);
    setInterval(() => loadAndRender(true), 5000);
}

function renderInventory(playerName, inventory) {
    let totalRegular = 0, totalUndead = 0, totalHalloween = 0;
    const regularSet = new Set(), undeadSet = new Set(), halloweenSet = new Set();

    // Собираем пойманное
    for (const [fish, count] of Object.entries(inventory)) {
        if (count <= 0) continue;
        const isUndead = normalizeKey(fish).startsWith('нежить ');
        const baseFish = isUndead ? fish.substring(7).trim() : fish;
        const baseNorm = normalizeKey(baseFish);

        if (isUndead) { totalUndead += count; undeadSet.add(baseNorm); }
        else if (HALLOWEEN_FISH.includes(fish) || HALLOWEEN_FISH.some(hf => normalizeKey(hf) === normalizeKey(fish))) {
            totalHalloween += count; halloweenSet.add(normalizeKey(fish));
        }
        else { totalRegular += count; regularSet.add(baseNorm); }
    }

    // Коллекция из стримербота
    const caughtHalloweenList = window._halloweenCollection ? window._halloweenCollection[playerName.toLowerCase()] || [] : [];
    const halloweenColSet = new Set(caughtHalloweenList.map(normalizeKey));

    const total = totalRegular + totalUndead + totalHalloween;
    const firstLetter = playerName.charAt(0).toUpperCase();

    let regCaught = 0, undCaught = 0, halCaught = 0;
    ALL_FISH.forEach(fish => {
        if (regularSet.has(normalizeKey(fish))) regCaught++;
        if (undeadSet.has(normalizeKey(fish))) undCaught++;
    });
    HALLOWEEN_FISH.forEach(fish => {
        if (halloweenColSet.has(normalizeKey(fish)) || halloweenSet.has(normalizeKey(fish))) halCaught++;
    });

    let html = `
        <div class="player-header">
            <div class="player-avatar">${firstLetter}</div>
            <div class="player-info">
                <h2>@${playerName}</h2>
                <div class="player-stats">Всего поймано: <span>${total}</span> рыб</div>
            </div>
            <a href="https://twitch.tv/${playerName}" target="_blank" class="twitch-link">📺 Twitch</a>
        </div>

        <div class="collection-progress" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="progress-block">
                <div class="progress-header"><span class="label">🐟 Обычные</span><span class="count">${regCaught} / 30</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round(regCaught/30*100)}%"></div></div>
            </div>
            <div class="progress-block undead">
                <div class="progress-header"><span class="label">🧟 Нежить</span><span class="count">${undCaught} / 30</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round(undCaught/30*100)}%"></div></div>
            </div>
            <div class="progress-block halloween" style="background: rgba(255, 100, 0, 0.1); border-color: rgba(255, 100, 0, 0.4);">
                <div class="progress-header"><span class="label">🎃 Хэллоуин</span><span class="count" style="color: #ff8c00;">${halCaught} / 9</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${Math.round(halCaught/9*100)}%; background: linear-gradient(90deg, #ff8c00, #ffd700);"></div></div>
            </div>
        </div>

        <div class="stats-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="stat-box"><div class="stat-icon">🐟</div><div class="stat-value">${totalRegular}</div><div class="stat-label">Обычные</div></div>
            <div class="stat-box undead"><div class="stat-icon">🧟</div><div class="stat-value">${totalUndead}</div><div class="stat-label">Нежить</div></div>
            <div class="stat-box" style="--c: #ff8c00;"><div class="stat-icon">🎃</div><div class="stat-value" style="color: #ff8c00;">${totalHalloween}</div><div class="stat-label">Хэллоуин</div></div>
        </div>
    `;

    // Обычные
    html += `<div class="fish-section"><h3>🐟 Обычные рыбы</h3><div class="fish-grid">`;
    ALL_FISH.forEach(fish => {
        const isCaught = regularSet.has(normalizeKey(fish));
        const entry = findNormalized(inventory, fish);
        const count = entry ? entry.value : 0;
        const itemClass = isCaught ? `rarity-${getFishInfo(fish).rarity}` : 'not-caught';
        html += `<div class="fish-item ${itemClass}" data-fish="${fish}"><div class="fish-item-inner"></div><img src="${getFishIcon(fish)}" class="fish-icon"><span class="fish-name">${fish}</span><span class="fish-count">×${count}</span></div>`;
    });
    html += `</div></div>`;

    // Нежить
    html += `<div class="fish-section undead-section" style="margin-top: 14px;"><h3>🧟 Нежить</h3><div class="fish-grid">`;
    ALL_FISH.forEach(fish => {
        const isCaught = undeadSet.has(normalizeKey(fish));
        const undeadName = 'Нежить ' + fish.toLowerCase();
        const entry = findNormalized(inventory, undeadName);
        const count = entry ? entry.value : 0;
        const itemClass = isCaught ? `undead rarity-${getFishInfo(undeadName).rarity}` : 'not-caught';
        html += `<div class="fish-item ${itemClass}" data-fish="${undeadName}"><div class="fish-item-inner"></div><img src="${getFishIcon(undeadName)}" class="fish-icon"><span class="fish-name">${fish}</span><span class="fish-count">×${count}</span></div>`;
    });
    html += `</div></div>`;

    // Хэллоуин
    html += `<div class="fish-section halloween-section" style="margin-top: 14px;"><h3>🎃 Хэллоуин</h3><div class="fish-grid">`;
    HALLOWEEN_FISH.forEach(fish => {
        const isCaught = halloweenSet.has(normalizeKey(fish)) || halloweenColSet.has(normalizeKey(fish));
        const entry = findNormalized(inventory, fish);
        const count = entry ? entry.value : 0;
        const itemClass = isCaught ? `halloween rarity-${getFishInfo(fish).rarity}` : 'not-caught';
        html += `<div class="fish-item ${itemClass}" data-fish="${fish}"><div class="fish-item-inner"></div><img src="${getFishIcon(fish)}" class="fish-icon"><span class="fish-name">${fish}</span><span class="fish-count">×${count}</span></div>`;
    });
    html += `</div></div>`;

    playerCard.innerHTML = html;

    document.querySelectorAll('.fish-item').forEach(item => {
        item.addEventListener('click', function(e) {
            e.stopPropagation();
            const fishName = this.getAttribute('data-fish');
            const count = parseInt(this.querySelector('.fish-count').textContent.replace('×', ''), 10);
            showFishModal(fishName, count);
        });
    });
}

function showFishModal(fishName, count) {
    currentModalFish = fishName;
    const info = getFishInfo(fishName);
    const rarity = RARITY_INFO[info.rarity];
    let lifetimeCount = getLifetimeCountForPlayer(playerName, fishName) || (count > 0 ? count : 0);
    const personalRecord = getPersonalRecordForPlayer(playerName, fishName);
    
    let recordHtml = personalRecord !== null ? `<div class="info-value record">${personalRecord} см</div>` : `<div class="info-value no-record">не установлен</div>`;
    const displayName = info.isUndead ? '🧟 ' + info.baseName : info.baseName;
    const bigIcon = getFishIcon(fishName, 5);

    const cornerSVG = `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M 5 5 Q 5 20 15 20 Q 28 20 28 10 Q 28 5 18 5 Q 12 5 12 12"/><path d="M 10 10 Q 10 18 20 18"/><circle cx="15" cy="15" r="2" fill="currentColor" stroke="none"/><path d="M 5 5 L 10 10" stroke-opacity="0.5"/></svg>`;
    let particlesHtml = '', holoHtml = '', crownHtml = '', gemsHtml = '';

    if (info.rarity === 'legendary' || info.rarity === 'epic') {
        particlesHtml = '<div class="modal-particles">';
        for (let i = 0; i < 12; i++) particlesHtml += `<div class="particle" style="left: ${5 + Math.random()*90}%; top: ${20 + Math.random()*70}%; animation-delay: ${Math.random()*4}s; animation-duration: ${3+Math.random()*2}s;"></div>`;
        particlesHtml += '</div>';
        holoHtml = '<div class="modal-holo"></div>';
        const gemChar = info.isUndead ? '💠' : '💎';
        gemsHtml = `<div class="modal-gem g1">${gemChar}</div><div class="modal-gem g2">${gemChar}</div><div class="modal-gem g3">${gemChar}</div><div class="modal-gem g4">${gemChar}</div>`;
    }
    if (info.rarity === 'legendary') crownHtml = `<div class="modal-crown">${info.isUndead ? '💀' : '👑'}</div>`;

    const modal = document.getElementById('fishModalContent');
    modal.className = 'fish-modal rarity-' + info.rarity + (info.isUndead ? ' undead' : '');
    modal.innerHTML = `
    <div class="modal-corner tl">${cornerSVG}</div><div class="modal-corner tr">${cornerSVG}</div>
    <div class="modal-corner bl">${cornerSVG}</div><div class="modal-corner br">${cornerSVG}</div>
    ${holoHtml}${crownHtml}${gemsHtml}${particlesHtml}
    <button class="modal-close" onclick="closeFishModal()">✕</button>
    <div class="modal-fish-icon-wrap"><img src="${bigIcon}" class="modal-fish-icon"></div>
    <div class="modal-fish-name ${info.isUndead ? 'undead' : ''}">${displayName}</div>
    <div class="modal-rarity rarity-${info.rarity}">${rarity.icon} ${rarity.label.toUpperCase()}</div>
    <div class="modal-info-grid">
        <div class="modal-info-block"><div class="info-label">Размер</div><div class="info-value">${info.min}–${info.max} см</div></div>
        <div class="modal-info-block"><div class="info-label">Твой рекорд</div>${recordHtml}</div>
    </div>
    <div class="modal-counts ${info.isUndead ? 'undead' : ''}">
        <div class="modal-count-item"><div class="count-label">📦 В инвентаре</div><div class="count-value">${count}</div></div>
        <div class="modal-count-item lifetime"><div class="count-label">🏆 Поймано за всё время</div><div class="count-value">${lifetimeCount}</div></div>
    </div>`;
    document.getElementById('fishModal').classList.add('show');
}

function closeFishModal() {
    document.getElementById('fishModal').classList.remove('show');
    currentModalFish = null;
}

function refreshOpenModal(fishName, count) {
    const modal = document.getElementById('fishModalContent');
    if (!modal) return;
    let lifetimeCount = getLifetimeCountForPlayer(playerName, fishName) || (count > 0 ? count : 0);
    
    const setCountValue = (el, newValue) => {
        if (!el) return;
        if (el.textContent.trim() !== String(newValue)) {
            el.textContent = newValue;
            el.classList.remove('updated'); void el.offsetWidth; el.classList.add('updated');
            setTimeout(() => el.classList.remove('updated'), 1000);
        }
    };

    const countItems = modal.querySelectorAll('.modal-count-item .count-value');
    if (countItems.length >= 1) setCountValue(countItems[0], count);
    if (countItems.length >= 2) setCountValue(countItems[1], lifetimeCount);

    const recordBlock = modal.querySelector('.modal-info-block:last-child');
    if (recordBlock) {
        const recordValueEl = recordBlock.querySelector('.info-value');
        if (recordValueEl) {
            const personalRecord = getPersonalRecordForPlayer(playerName, fishName);
            if (personalRecord !== null) {
                if (recordValueEl.textContent.trim() !== personalRecord + ' см') {
                    recordValueEl.className = 'info-value record';
                    recordValueEl.textContent = personalRecord + ' см';
                    recordValueEl.classList.remove('updated'); void recordValueEl.offsetWidth; recordValueEl.classList.add('updated');
                    setTimeout(() => recordValueEl.classList.remove('updated'), 1000);
                }
            } else if (recordValueEl.textContent.trim() !== 'не установлен') {
                recordValueEl.className = 'info-value no-record';
                recordValueEl.textContent = 'не установлен';
            }
        }
    }
}

document.getElementById('fishModal').addEventListener('click', function(e) { if (e.target === this) closeFishModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeFishModal(); });
</script>
</body>
</html>
